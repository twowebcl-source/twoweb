<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Tienda</title>
  <meta name="description" content="Compra online y retira o recibe en tu casa.">
  <link rel="icon" href="data:,">
  <script src="config.js"></script>
  <script src="fondos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ===== TEMAS: los mismos 6 de la agenda y la página de barbería (se eligen en el panel) ===== */
    :root { --voltaje:#ff7a2f; }
    :root { --fondo:#111318; --panel:#1b1e25; --panel2:#232730; --hueso:#f1eee8; --gris:#9aa0a8;
      --borde:color-mix(in srgb, var(--hueso) 9%, transparent); --verde:#4ade80; --rojo:#f87171;
      --r:16px; --r-s:10px; --r-pill:999px; --fuente:'Inter',system-ui,-apple-system,sans-serif; --fuente-tit:inherit; --sobre:#111;
      --voltaje-suave:color-mix(in srgb, var(--voltaje) 13%, transparent); }
    html[data-tema="burbuja"] { --fondo:#131726; --panel:#1c2135; --panel2:#262c44; --hueso:#eef1fb; --gris:#9aa3bf; --borde:color-mix(in srgb, var(--hueso) 8%, transparent);
      --r:28px; --r-s:18px; --fuente:'Nunito',system-ui,sans-serif; --fuente-tit:'Nunito',system-ui,sans-serif; }
    html[data-tema="vintage"] { --fondo:#efe6d6; --panel:#fbf6ec; --panel2:#f1e7d4; --hueso:#2a1f16; --gris:#76644f; --borde:color-mix(in srgb, var(--hueso) 22%, transparent);
      --verde:#2f7d3b; --rojo:#b3261e; --r:3px; --r-s:2px; --r-pill:3px; --fuente:Georgia,'Times New Roman',serif; --fuente-tit:'Playfair Display',Georgia,serif; }
    html[data-tema="neon"] { --fondo:#07080c; --panel:#0e1017; --panel2:#161a24; --hueso:#f4f6ff; --gris:#8a93a8; --borde:color-mix(in srgb, var(--hueso) 11%, transparent);
      --verde:#39ff88; --rojo:#ff4d6d; --r:0px; --r-s:0px; --r-pill:0px; --fuente:system-ui,-apple-system,sans-serif; --fuente-tit:'Oswald',Impact,sans-serif; }
    html[data-tema="minimal"] { --fondo:#f4f5f7; --panel:#ffffff; --panel2:#f0f1f4; --hueso:#14161b; --gris:#6b7280; --borde:color-mix(in srgb, var(--hueso) 11%, transparent);
      --verde:#15803d; --rojo:#dc2626; --r:12px; --r-s:8px; --fuente:'Inter',system-ui,-apple-system,sans-serif; --fuente-tit:'Inter',system-ui,sans-serif; }
    html[data-tema="organico"] { --fondo:#171512; --panel:#221f1a; --panel2:#2d2923; --hueso:#f3ebe0; --gris:#a99d8d; --borde:color-mix(in srgb, var(--hueso) 10%, transparent);
      --verde:#8fd18a; --rojo:#f08a7a; --r:28px 8px 28px 8px; --r-s:16px 5px 16px 5px; --r-pill:18px 6px 18px 6px; --fuente:system-ui,-apple-system,sans-serif; --fuente-tit:'Fraunces',Georgia,serif; }

    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { background:var(--fondo); color:var(--hueso); font-family:var(--fuente); line-height:1.5; }
    .oculto { display:none !important; }
    a { color:inherit; }
    .caja { max-width:1120px; margin:0 auto; padding:0 18px; }
    h1, h2, h3, .marca { font-family:var(--fuente-tit); }
    button, input, textarea, select { font-family:inherit; }

    /* Cabecera */
    header { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--fondo) 90%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--borde); }
    .cab { display:flex; align-items:center; gap:18px; height:64px; }
    .marca { display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; text-decoration:none; min-width:0; }
    .marca img { width:40px; height:40px; object-fit:contain; border-radius:var(--r-s); }
    .marca span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    nav { display:flex; gap:20px; margin-left:auto; font-size:14px; }
    nav a { text-decoration:none; color:var(--gris); font-weight:600; }
    nav a:hover { color:var(--hueso); }
    .btn-carro { position:relative; background:var(--panel); border:1px solid var(--borde); color:var(--hueso); border-radius:var(--r-s); padding:8px 14px; cursor:pointer; font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; }
    .btn-carro:hover { border-color:var(--voltaje); }
    .btn-carro .n { background:var(--voltaje); color:var(--sobre); border-radius:var(--r-pill); min-width:20px; height:20px; padding:0 6px; font-size:12px; display:inline-flex; align-items:center; justify-content:center; }
    .boton { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--voltaje); color:var(--sobre); border:none; border-radius:var(--r-s);
             padding:12px 20px; font-weight:800; font-size:15px; text-decoration:none; cursor:pointer; white-space:nowrap; }
    .boton:hover { filter:brightness(1.08); }
    .boton:disabled { opacity:.5; cursor:not-allowed; filter:none; }
    .boton.sec { background:transparent; color:var(--hueso); border:1px solid color-mix(in srgb, var(--hueso) 30%, transparent); }
    .boton.wsp { background:#25d366; color:#fff; }

    /* Portada */
    .hero { position:relative; min-height:300px; display:flex; align-items:flex-end; overflow:hidden;
            background:radial-gradient(circle at 80% 10%, color-mix(in srgb, var(--voltaje) 35%, transparent), transparent 50%), var(--panel); }
    .hero .foto-fondo { position:absolute; inset:0; background:center/cover no-repeat; }
    .hero .foto-fondo::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.78) 85%); }
    .hero .caja { position:relative; width:100%; padding-top:56px; padding-bottom:40px; }
    .hero.con-foto { color:#fff; }
    .hero h1 { font-size:clamp(30px, 6vw, 52px); line-height:1.05; font-weight:800; max-width:760px; }
    .hero p { font-size:clamp(15px, 2.2vw, 18px); margin-top:10px; max-width:620px; opacity:.92; }
    .hero .acciones { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
    .hero.con-foto .boton.sec { color:#fff; border-color:rgba(255,255,255,0.5); }

    /* Catálogo */
    section.bloque { padding-top:44px; padding-bottom:10px; }
    .titulo { display:flex; align-items:end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
    .titulo small { display:block; color:var(--voltaje); font-weight:800; letter-spacing:2px; text-transform:uppercase; font-size:12px; margin-bottom:4px; font-family:var(--fuente); }
    .titulo h2 { font-size:clamp(24px, 4vw, 34px); line-height:1.1; }
    .buscar { background:var(--panel); border:1px solid var(--borde); color:var(--hueso); border-radius:var(--r-pill); padding:10px 16px; font-size:14px; width:min(320px, 100%); }
    .buscar:focus { outline:none; border-color:var(--voltaje); }
    .cats { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px; scrollbar-width:thin; }
    .cat { background:var(--panel); border:1px solid var(--borde); color:var(--gris); padding:8px 16px; border-radius:var(--r-pill); cursor:pointer; font-size:14px; font-weight:700; white-space:nowrap; }
    .cat.sel { background:var(--voltaje); border-color:var(--voltaje); color:var(--sobre); }
    .grilla { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:14px; }
    .prod { background:var(--panel); border:1px solid var(--borde); border-radius:var(--r); overflow:hidden; display:flex; flex-direction:column; transition:border-color .15s, transform .15s; }
    .prod:hover { border-color:var(--voltaje); transform:translateY(-2px); }
    .prod .foto { position:relative; aspect-ratio:1/1; background:var(--panel2) center/cover no-repeat; cursor:pointer; display:flex; align-items:center; justify-content:center;
                  font-size:54px; font-weight:800; color:color-mix(in srgb, var(--voltaje) 70%, transparent); border:none; width:100%; }
    .prod .sello { position:absolute; top:10px; left:10px; background:var(--voltaje); color:var(--sobre); font-size:11px; font-weight:800; padding:3px 9px; border-radius:var(--r-pill); text-transform:uppercase; letter-spacing:.5px; }
    .prod .sello.agotado { background:var(--panel); color:var(--gris); border:1px solid var(--borde); }
    .prod .info { padding:12px 14px 14px; display:flex; flex-direction:column; gap:4px; flex:1; }
    .prod .nom { font-weight:700; font-size:15px; line-height:1.3; cursor:pointer; }
    .prod .desc { color:var(--gris); font-size:13px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .prod .pie { display:flex; align-items:end; justify-content:space-between; gap:8px; margin-top:auto; padding-top:8px; }
    .precio { font-weight:800; font-size:18px; font-family:var(--fuente-tit); }
    .antes { color:var(--gris); font-size:12.5px; text-decoration:line-through; display:block; font-weight:500; }
    .quedan { font-size:12px; color:var(--voltaje); font-weight:700; }
    .agregar { background:var(--voltaje-suave); color:var(--hueso); border:1px solid color-mix(in srgb, var(--voltaje) 55%, transparent); border-radius:var(--r-s); padding:8px 12px; font-weight:800; cursor:pointer; font-size:13.5px; white-space:nowrap; }
    .agregar:hover { background:var(--voltaje); color:var(--sobre); }
    .agregar:disabled { opacity:.45; cursor:not-allowed; background:transparent; color:var(--gris); border-color:var(--borde); }
    .vacio { color:var(--gris); padding:30px 0; text-align:center; }

    /* Información y contacto */
    .info-compra { background:var(--panel); border:1px solid var(--borde); border-left:4px solid var(--voltaje); border-radius:var(--r); padding:18px 20px; white-space:pre-line; }
    .contacto { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
    .contacto a { display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--borde); border-radius:var(--r); padding:16px 18px; text-decoration:none; font-weight:700; }
    .contacto a:hover { border-color:var(--voltaje); }
    .contacto .ic { width:42px; height:42px; border-radius:var(--r-s); background:var(--voltaje-suave); display:flex; align-items:center; justify-content:center; font-size:20px; }
    .contacto small { display:block; color:var(--gris); font-weight:500; font-size:13px; }
    footer { padding:40px 0 100px; text-align:center; color:var(--gris); font-size:13px; }
    footer a { color:var(--gris); }

    /* Barra inferior en el celular */
    .barra-carro { position:fixed; left:12px; right:12px; bottom:14px; z-index:30; display:none; }
    .barra-carro .boton { width:100%; padding:15px; box-shadow:0 10px 30px rgba(0,0,0,0.4); justify-content:space-between; }

    /* Ventanas: detalle de producto y carrito */
    .fondo { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.55); display:flex; justify-content:flex-end; }
    .fondo.centro { align-items:center; justify-content:center; padding:16px; }
    .cajon { width:min(440px, 100%); height:100%; background:var(--fondo); border-left:1px solid var(--borde); display:flex; flex-direction:column; animation:entra .25s ease-out; }
    @keyframes entra { from { transform:translateX(30px); opacity:0; } to { transform:none; opacity:1; } }
    .cajon .cab-c { display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--borde); }
    .cajon .cab-c h3 { font-size:20px; }
    .cerrar { background:none; border:none; color:var(--gris); font-size:28px; line-height:1; cursor:pointer; padding:0 4px; }
    .cajon .cuerpo { flex:1; overflow-y:auto; padding:14px 20px; }
    .cajon .pie-c { border-top:1px solid var(--borde); padding:16px 20px; background:var(--panel); }
    .item { display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--borde); }
    .item .mini { width:56px; height:56px; border-radius:var(--r-s); background:var(--panel2) center/cover no-repeat; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--voltaje); }
    .item .txt { flex:1; min-width:0; }
    .item .txt b { display:block; font-size:14px; }
    .item .txt span { color:var(--gris); font-size:12.5px; }
    .cant { display:flex; align-items:center; gap:6px; }
    .cant button { width:30px; height:30px; border-radius:var(--r-s); border:1px solid var(--borde); background:var(--panel); color:var(--hueso); font-size:16px; cursor:pointer; }
    .cant button:hover { border-color:var(--voltaje); }
    .cant span { min-width:22px; text-align:center; font-weight:700; }
    .total { display:flex; justify-content:space-between; align-items:baseline; font-size:15px; margin-bottom:12px; }
    .total b { font-size:24px; font-family:var(--fuente-tit); }
    label.l { display:block; font-size:13px; color:var(--gris); margin:12px 0 5px; font-weight:600; }
    .campo { width:100%; background:var(--panel); border:1px solid var(--borde); color:var(--hueso); border-radius:var(--r-s); padding:12px 14px; font-size:15px; }
    .campo:focus { outline:none; border-color:var(--voltaje); }
    .tel { display:flex; }
    .tel span { background:var(--panel2); border:1px solid var(--borde); border-right:none; border-radius:var(--r-s) 0 0 var(--r-s); padding:12px 12px; font-size:15px; color:var(--gris); }
    .tel .campo { border-radius:0 var(--r-s) var(--r-s) 0; }
    .opciones { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .opcion { border:1px solid var(--borde); background:var(--panel); border-radius:var(--r-s); padding:12px; cursor:pointer; text-align:left; color:var(--hueso); font-size:14px; font-weight:700; }
    .opcion small { display:block; color:var(--gris); font-weight:500; font-size:12px; }
    .opcion.sel { border-color:var(--voltaje); background:var(--voltaje-suave); }
    .error { color:var(--rojo); font-size:14px; margin-top:10px; min-height:18px; }
    .ok-ped { text-align:center; padding:20px 4px; }
    .ok-ped .check { width:64px; height:64px; border-radius:50%; background:var(--verde); color:#111; font-size:32px; font-weight:800; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
    .ok-ped h3 { font-size:22px; margin-bottom:6px; }
    .ok-ped p { color:var(--gris); font-size:14px; }
    .resumen { text-align:left; background:var(--panel); border:1px solid var(--borde); border-radius:var(--r-s); padding:12px 14px; margin:16px 0; font-size:14px; }
    .resumen div { display:flex; justify-content:space-between; gap:10px; padding:3px 0; }
    .detalle-prod { width:min(760px, 100%); max-height:92vh; overflow:auto; background:var(--fondo); border:1px solid var(--borde); border-radius:var(--r); display:grid; grid-template-columns:1fr 1fr; animation:entra .2s ease-out; }
    .detalle-prod .foto-g { background:var(--panel2) center/cover no-repeat; min-height:320px; display:flex; align-items:center; justify-content:center; font-size:90px; font-weight:800; color:color-mix(in srgb, var(--voltaje) 70%, transparent); }
    .detalle-prod .txt { padding:22px; display:flex; flex-direction:column; gap:10px; position:relative; }
    .detalle-prod .txt .cerrar { position:absolute; top:10px; right:12px; }
    .detalle-prod .cat-txt { color:var(--voltaje); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; }
    .detalle-prod h3 { font-size:24px; line-height:1.15; padding-right:24px; }
    .detalle-prod p { color:var(--gris); font-size:14.5px; white-space:pre-line; }
    .aviso { max-width:520px; margin:90px auto; text-align:center; padding:0 18px; }
    .aviso h1 { font-size:26px; margin-bottom:10px; }
    .aviso p { color:var(--gris); }
    .cargando { padding:120px 0; text-align:center; color:var(--gris); }
    .flotante { position:fixed; right:18px; bottom:18px; z-index:30; width:56px; height:56px; border-radius:50%; background:#25d366; color:#fff; display:flex; align-items:center;
                justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,0.35); text-decoration:none; font-size:26px; }
    @media (max-width:760px){
      nav { display:none; }
      .btn-carro { margin-left:auto; }
      .grilla { grid-template-columns:repeat(2, 1fr); gap:10px; }
      .prod .info { padding:10px 10px 12px; }
      .prod .pie { flex-direction:column; align-items:stretch; }
      .precio { font-size:16px; }
      .barra-carro.hay { display:block; }
      .flotante { bottom:84px; }
      .detalle-prod { grid-template-columns:1fr; }
      .detalle-prod .foto-g { min-height:260px; }
    }
    /* Toques de cada tema */
    html[data-tema="vintage"] :is(.prod, .contacto a, .info-compra) { border:4px double color-mix(in srgb, var(--hueso) 30%, transparent); }
    html[data-tema="vintage"] .boton { text-transform:uppercase; letter-spacing:1.5px; }
    html[data-tema="neon"] :is(h1, h2, .boton, .cat) { text-transform:uppercase; letter-spacing:1px; }
    html[data-tema="neon"] .prod:hover { box-shadow:0 0 0 1px var(--voltaje), 0 0 18px color-mix(in srgb, var(--voltaje) 50%, transparent); }
    html[data-tema="burbuja"] :is(.prod, .contacto a) { border-color:transparent; box-shadow:0 10px 28px rgba(0,0,0,0.28); }
    html[data-tema="minimal"] :is(.prod, .contacto a) { box-shadow:0 1px 2px rgba(15,20,30,0.06); }
    .hero .logo-grande { width:84px; height:84px; object-fit:contain; border-radius:var(--r); background:color-mix(in srgb, var(--fondo) 50%, transparent); margin-bottom:14px; display:block; }
  </style>
</head>
<body>
  <header>
    <div class="caja cab">
      <a class="marca" id="marca" href="#inicio"><span>&nbsp;</span></a>
      <nav id="menu"><a href="#productos">Productos</a><a href="#info" id="navInfo">Cómo comprar</a><a href="#contacto" id="navContacto">Contacto</a><a href="#" id="navAgenda" class="oculto">Reservar hora</a></nav>
      <button class="btn-carro oculto" id="btnCarro" onclick="abrirCarro()">🛒 <span class="n" id="nCarro">0</span></button>
    </div>
  </header>
  <main id="contenido"><div class="cargando">Cargando…</div></main>
  <div class="barra-carro" id="barraCarro"><button class="boton" onclick="abrirCarro()"><span>🛒 Ver carrito (<span id="nCarro2">0</span>)</span><span id="totCarro2">$0</span></button></div>
  <a class="flotante oculto" id="flotante" target="_blank" rel="noopener" title="Escríbenos por WhatsApp">💬</a>
  <div id="capa"></div>

  <script>
    const CONF = window.TWOWEB || {};
    const SUPABASE_URL = CONF.SUPABASE_URL, SUPABASE_KEY = CONF.SUPABASE_KEY;
    // ¿De qué negocio es esta tienda?  1) su dominio propio  2) tienda.html?b=link-del-negocio
    const QS = new URLSearchParams(location.search);
    const DOMINIO_PROPIO = CONF.dominioPropio ? CONF.dominioPropio() : '';
    const SLUG = (QS.get('b') || QS.get('negocio') || DOMINIO_PROPIO || '').trim().toLowerCase();
    const CORTO = QS.has('_c') && SLUG && !DOMINIO_PROPIO;   // se llegó por twoweb.cl/negocio/tienda
    const $ = id => document.getElementById(id);
    const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const clp = x => "$" + Number(x || 0).toLocaleString("es-CL");
    const leer = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
    const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
    const agendaUrl = () => CORTO ? '/' + SLUG + '/reservar' : 'agenda.html' + (SLUG && !DOMINIO_PROPIO ? '?b=' + encodeURIComponent(SLUG) : '');
    const paginaUrl = () => CORTO ? '/' + SLUG : DOMINIO_PROPIO ? '/' : 'barberia.html' + (SLUG ? '?b=' + encodeURIComponent(SLUG) : '');

    // ---------- Temas (iguales a la agenda) ----------
    const TEMAS = ['clasico', 'burbuja', 'vintage', 'neon', 'minimal', 'organico'];
    const FUENTES = { burbuja:'Nunito:wght@400;600;700;800', vintage:'Playfair+Display:wght@600;700;800', neon:'Oswald:wght@500;600;700',
                      minimal:'Inter:wght@400;500;600;700;800', organico:'Fraunces:opsz,wght@9..144,600;9..144,800' };
    const ACENTO = { clasico:'#ff7a2f', burbuja:'#7c83ff', vintage:'#a4161a', neon:'#00e5ff', minimal:'#111827', organico:'#d9a05b' };
    function textoSobre(c){
      const l = i => { const x = parseInt(c.slice(i, i + 2), 16) / 255; return x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; };
      const L = .2126 * l(1) + .7152 * l(3) + .0722 * l(5);
      return (L + .05) / .0556 >= 1.05 / (L + .05) ? '#111' : '#fff';
    }
    function aplicarTema(tema, color){
      const t = TEMAS.includes(tema) ? tema : 'clasico', raiz = document.documentElement;
      if (t === 'clasico') delete raiz.dataset.tema; else raiz.dataset.tema = t;
      if (FUENTES[t] && !document.getElementById('fuente-' + t)){
        const l = document.createElement('link'); l.id = 'fuente-' + t; l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=' + FUENTES[t] + '&display=swap'; document.head.appendChild(l);
      }
      const c = /^#[0-9a-f]{6}$/i.test(color || '') ? color : ACENTO[t];
      raiz.style.setProperty('--voltaje', c); raiz.style.setProperty('--sobre', textoSobre(c));
    }
    const K_TEMA = 'twoweb-tema-' + (SLUG || CONF.PRINCIPAL || 'twoweb');     // misma clave que la agenda: no parpadea al pasar de una a otra
    const K_CARRO = 'twoweb-carrito-' + (SLUG || 'principal');
    const K_CLIENTE = 'twoweb-cliente';
    { const g = leer(K_TEMA); if (g) aplicarTema(g.tema, g.color); }

    let CFG = null, PRODS = [], CAT = '', BUSCA = '', CARRO = [], ENTREGA = 'retiro', ENVIANDO = false;

    function aviso(titulo, texto){
      $('contenido').innerHTML = `<div class="aviso"><h1>${titulo}</h1><p>${texto}</p></div>`;
      $('menu').classList.add('oculto'); $('btnCarro').classList.add('oculto'); $('barraCarro').classList.add('oculto');
    }

    async function iniciar(){
      const { data, error } = await db.rpc('tienda_config', { p_negocio: SLUG || null });
      if (error) return aviso('Esta tienda no existe', (error.message || '').includes('NEGOCIO_NO_EXISTE') ? 'Revisa el link que te enviaron.'
        : /tienda_config/.test(error.message || '') ? 'Falta instalar la Fase 14 en la base de datos.' : 'No pudimos cargar la tienda: ' + esc(error.message));
      const n = data.negocio || {};
      aplicarTema(n.tema, n.color);
      if (typeof aplicarEstiloPublico === 'function') aplicarEstiloPublico(n);
      pintarCabecera(n);
      if (data.suspendido) return aviso(esc(n.nombre || ''), `Nuestra tienda no está disponible por ahora.${n.whatsapp ? `<br><br><a class="boton wsp" href="https://wa.me/${esc(n.whatsapp.replace(/\D/g, ''))}">Escríbenos por WhatsApp</a>` : ''}`);
      if (!n.mod_tienda) {
        if (n.mod_agenda) { location.replace(paginaUrl()); return; }
        return aviso(esc(n.nombre || ''), 'Este negocio no tiene tienda online.');
      }
      guardar(K_TEMA, { tema: n.tema, color: n.color });
      CFG = data; PRODS = data.productos || [];
      // carrito guardado en este teléfono: se queda solo con lo que sigue disponible
      CARRO = (leer(K_CARRO) || []).filter(x => PRODS.some(p => p.id === x.id && !p.agotado)).map(x => ({ id: x.id, cantidad: Math.max(1, Math.min(99, x.cantidad | 0)) }));
      if (CORTO){ const b = document.createElement('base'); b.href = '/'; document.head.prepend(b); history.replaceState(null, '', '/' + SLUG + '/tienda' + location.hash); }
      dibujar();
      const q = QS.get('producto'); if (q && PRODS.some(p => String(p.id) === q)) verProducto(Number(q));
    }

    function pintarCabecera(n){
      const nombre = n.nombre || 'Tienda';
      document.title = nombre + ' — Tienda online';
      document.querySelector('meta[name="description"]').content = n.bienvenida || `Compra online en ${nombre}.`;
      $('marca').innerHTML = (n.logo_url ? `<img src="${esc(n.logo_url)}" alt="">` : '') + `<span>${esc(nombre)}</span>`;
      if (typeof iconoNegocioPublico === 'function') iconoNegocioPublico(n);          // pestaña: logo del local (o su inicial)
    }

    function dibujar(){
      const n = CFG.negocio, wsp = (n.whatsapp || '').replace(/\D/g, ''), insta = (n.instagram || '').replace(/^@/, '');
      const cats = [...new Set(PRODS.map(p => p.categoria).filter(Boolean))];
      $('contenido').innerHTML = `
        <section class="hero ${n.portada_url ? 'con-foto' : ''}" id="inicio">
          ${n.portada_url ? `<div class="foto-fondo" style="background-image:url('${esc(n.portada_url)}')"></div>` : ''}
          <div class="caja">
            ${n.logo_url ? `<img class="logo-grande" src="${esc(n.logo_url)}" alt="">` : ''}
            <h1>${esc(n.nombre)}</h1>
            <p>${esc(n.bienvenida || 'Elige tus productos, envía tu pedido y te confirmamos por WhatsApp.')}</p>
            <div class="acciones">
              <a class="boton" href="#productos">🛍 Ver productos</a>
              ${n.mod_agenda ? `<a class="boton sec" href="${agendaUrl()}">📅 Reservar hora</a>` : ''}
              ${wsp ? `<a class="boton sec" href="https://wa.me/${wsp}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
            </div>
          </div>
        </section>

        <section class="bloque caja" id="productos">
          <div class="titulo"><div><small>Catálogo</small><h2>Nuestros productos</h2></div>
            ${PRODS.length > 6 ? `<input class="buscar" id="buscar" type="search" placeholder="Buscar producto…" oninput="BUSCA=this.value; dibujarGrilla()">` : ''}</div>
          ${cats.length > 1 ? `<div class="cats" id="cats">${['', ...cats].map(c => `<button class="cat ${c === CAT ? 'sel' : ''}" data-c="${esc(c)}" onclick="elegirCat(this.dataset.c)">${c ? esc(c) : 'Todo'}</button>`).join('')}</div>` : ''}
          <div class="grilla" id="grilla"></div>
        </section>

        ${n.tienda_info ? `<section class="bloque caja" id="info"><div class="titulo"><div><small>Información</small><h2>Cómo comprar</h2></div></div>
          <div class="info-compra">${esc(n.tienda_info)}</div></section>` : ''}

        ${wsp || insta || n.correo ? `<section class="bloque caja" id="contacto">
          <div class="titulo"><div><small>Contacto</small><h2>Hablemos</h2></div></div>
          <div class="contacto">
            ${wsp ? `<a href="https://wa.me/${wsp}" target="_blank" rel="noopener"><span class="ic">💬</span><span>WhatsApp<small>${esc(n.whatsapp)}</small></span></a>` : ''}
            ${insta ? `<a href="https://www.instagram.com/${encodeURIComponent(insta)}/" target="_blank" rel="noopener"><span class="ic">📷</span><span>Instagram<small>@${esc(insta)}</small></span></a>` : ''}
            ${n.correo ? `<a href="mailto:${esc(n.correo)}"><span class="ic">✉️</span><span>Correo<small>${esc(n.correo)}</small></span></a>` : ''}
          </div></section>` : ''}

        <footer class="caja">© ${new Date().getFullYear()} ${esc(n.nombre)}${n.mod_agenda ? ` · <a href="${agendaUrl()}">Reservar hora</a>` : ''} · <a href="panel.html?n=${encodeURIComponent(n.slug || '')}">Acceso equipo</a><br>
          <span style="opacity:.75;">Tienda online con <a href="${esc(CONF.SITIO || '#')}" target="_blank" rel="noopener">${esc(CONF.MARCA || 'TwoWeb')}</a></span> · <a href="privacidad.html">Privacidad</a></footer>`;
      $('navInfo').classList.toggle('oculto', !n.tienda_info);
      $('navContacto').classList.toggle('oculto', !(wsp || insta || n.correo));
      if (n.mod_agenda){ $('navAgenda').href = agendaUrl(); $('navAgenda').classList.remove('oculto'); }
      if (wsp){ $('flotante').href = 'https://wa.me/' + wsp; $('flotante').classList.remove('oculto'); }
      $('btnCarro').classList.remove('oculto');
      dibujarGrilla(); pintarContador();
    }

    function elegirCat(c){ CAT = c; document.querySelectorAll('.cat').forEach(b => b.classList.toggle('sel', b.dataset.c === c)); dibujarGrilla(); }
    const sinTildes = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const precioDe = p => p.precio_oferta ?? p.precio;
    const fotoStyle = p => p.imagen_url ? `style="background-image:url('${esc(p.imagen_url)}')"` : '';
    const inicial = p => p.imagen_url ? '' : esc((p.nombre || '?')[0].toUpperCase());

    function dibujarGrilla(){
      const b = sinTildes(BUSCA.trim());
      const lista = PRODS.filter(p => (!CAT || p.categoria === CAT) && (!b || sinTildes(p.nombre + ' ' + (p.descripcion || '') + ' ' + (p.categoria || '')).includes(b)));
      if (!PRODS.length) { $('grilla').innerHTML = '<p class="vacio">Pronto publicaremos nuestros productos.</p>'; return; }
      if (!lista.length) { $('grilla').innerHTML = '<p class="vacio">No encontramos productos con esa búsqueda.</p>'; return; }
      $('grilla').innerHTML = lista.map(p => `<article class="prod">
          <button class="foto" ${fotoStyle(p)} onclick="verProducto(${p.id})" aria-label="Ver ${esc(p.nombre)}">${inicial(p)}
            ${p.agotado ? '<span class="sello agotado">Agotado</span>' : p.precio_oferta != null ? '<span class="sello">Oferta</span>' : p.destacado ? '<span class="sello">Destacado</span>' : ''}</button>
          <div class="info">
            <div class="nom" onclick="verProducto(${p.id})">${esc(p.nombre)}</div>
            ${p.descripcion ? `<div class="desc">${esc(p.descripcion)}</div>` : ''}
            <div class="pie">
              <div>${p.precio_oferta != null ? `<span class="antes">${clp(p.precio)}</span>` : ''}<span class="precio">${clp(precioDe(p))}</span>
                ${p.quedan ? `<div class="quedan">${p.quedan === 1 ? '¡Queda 1!' : `¡Quedan ${p.quedan}!`}</div>` : ''}</div>
              <button class="agregar" onclick="agregar(${p.id})" ${p.agotado ? 'disabled' : ''}>${p.agotado ? 'Agotado' : '+ Agregar'}</button>
            </div>
          </div></article>`).join('');
    }

    function verProducto(id){
      const p = PRODS.find(x => x.id === id); if (!p) return;
      $('capa').innerHTML = `<div class="fondo centro" onclick="if(event.target===this)cerrarCapa()"><div class="detalle-prod" role="dialog" aria-label="${esc(p.nombre)}">
          <div class="foto-g" ${fotoStyle(p)}>${inicial(p)}</div>
          <div class="txt"><button class="cerrar" onclick="cerrarCapa()" aria-label="Cerrar">×</button>
            ${p.categoria ? `<div class="cat-txt">${esc(p.categoria)}</div>` : ''}
            <h3>${esc(p.nombre)}</h3>
            <div>${p.precio_oferta != null ? `<span class="antes">${clp(p.precio)}</span>` : ''}<span class="precio" style="font-size:26px;">${clp(precioDe(p))}</span>
              ${p.quedan ? `<div class="quedan">${p.quedan === 1 ? '¡Queda 1!' : `¡Quedan ${p.quedan}!`}</div>` : ''}</div>
            ${p.descripcion ? `<p>${esc(p.descripcion)}</p>` : ''}
            <div style="margin-top:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
              ${p.agotado ? '<button class="boton" disabled>Agotado</button>' : `<div class="cant"><button onclick="cantDet(-1)">−</button><span id="cantDet" data-max="${maxDe(p)}">1</span><button onclick="cantDet(1)">+</button></div>
              <button class="boton" onclick="agregar(${p.id}, +$('cantDet').textContent); cerrarCapa()">Agregar al carrito</button>`}
            </div></div></div></div>`;
    }
    function cantDet(d){ const e = $('cantDet'); e.textContent = Math.max(1, Math.min(+e.dataset.max || 99, +e.textContent + d)); }
    // Tope por producto: si quedan pocas unidades, no se puede pedir más de eso
    const maxDe = p => p.quedan || 99;
    function avisoTope(p){
      const t = document.createElement('div'); t.textContent = maxDe(p) === 1 ? `Solo queda 1 de "${p.nombre}"` : `Solo quedan ${maxDe(p)} de "${p.nombre}"`;
      t.style.cssText = 'position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:60;background:var(--panel);border:1px solid var(--voltaje);border-radius:var(--r-s);padding:10px 16px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);';
      document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
    }
    function cerrarCapa(){ $('capa').innerHTML = ''; }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarCapa(); });

    // ---------- Carrito ----------
    function agregar(id, n = 1){
      const p = PRODS.find(x => x.id === id); if (!p || p.agotado) return;
      const it = CARRO.find(x => x.id === id), tope = maxDe(p);
      if (it && it.cantidad >= tope) return avisoTope(p);
      if (it) it.cantidad = Math.min(tope, it.cantidad + n); else CARRO.push({ id, cantidad: Math.min(tope, n) });
      guardar(K_CARRO, CARRO); pintarContador();
      const b = $('btnCarro'); b.animate([{ transform:'scale(1)' }, { transform:'scale(1.15)' }, { transform:'scale(1)' }], { duration:300 });
    }
    function cambiar(id, d){
      const it = CARRO.find(x => x.id === id); if (!it) return;
      const p = PRODS.find(x => x.id === id), tope = maxDe(p || {});
      if (d > 0 && it.cantidad >= tope) return avisoTope(p);
      it.cantidad += d; if (it.cantidad <= 0) CARRO = CARRO.filter(x => x.id !== id);
      it.cantidad = Math.min(tope, it.cantidad);
      guardar(K_CARRO, CARRO); pintarContador(); dibujarCarro();
    }
    const unidades = () => CARRO.reduce((a, x) => a + x.cantidad, 0);
    const totalCarro = () => CARRO.reduce((a, x) => a + precioDe(PRODS.find(p => p.id === x.id) || {}) * x.cantidad, 0);
    function pintarContador(){
      const u = unidades();
      $('nCarro').textContent = $('nCarro2').textContent = u; $('totCarro2').textContent = clp(totalCarro());
      $('barraCarro').classList.toggle('hay', u > 0 && !$('capa').innerHTML);
    }
    function abrirCarro(){
      $('capa').innerHTML = `<div class="fondo" onclick="if(event.target===this)cerrarCarro()"><aside class="cajon" role="dialog" aria-label="Tu carrito">
        <div class="cab-c"><h3 id="tituloCarro">Tu carrito</h3><button class="cerrar" onclick="cerrarCarro()" aria-label="Cerrar">×</button></div>
        <div class="cuerpo" id="cuerpoCarro"></div><div class="pie-c" id="pieCarro"></div></aside></div>`;
      $('barraCarro').classList.remove('hay');
      dibujarCarro();
    }
    function cerrarCarro(){ cerrarCapa(); pintarContador(); }
    function dibujarCarro(){
      if (!$('cuerpoCarro')) return;
      $('tituloCarro').textContent = 'Tu carrito';
      if (!CARRO.length){
        $('cuerpoCarro').innerHTML = '<p class="vacio">Tu carrito está vacío.</p>';
        $('pieCarro').innerHTML = '<button class="boton sec" style="width:100%;" onclick="cerrarCarro()">Seguir comprando</button>'; return;
      }
      $('cuerpoCarro').innerHTML = CARRO.map(x => { const p = PRODS.find(y => y.id === x.id); return `<div class="item">
          <div class="mini" ${fotoStyle(p)}>${inicial(p)}</div>
          <div class="txt"><b>${esc(p.nombre)}</b><span>${clp(precioDe(p))} c/u · ${clp(precioDe(p) * x.cantidad)}</span></div>
          <div class="cant"><button onclick="cambiar(${p.id}, -1)" aria-label="Quitar uno">−</button><span>${x.cantidad}</span><button onclick="cambiar(${p.id}, 1)" aria-label="Agregar uno">+</button></div></div>`; }).join('');
      $('pieCarro').innerHTML = `<div class="total"><span>Total (${unidades()} ${unidades() === 1 ? 'producto' : 'productos'})</span><b>${clp(totalCarro())}</b></div>
        <button class="boton" style="width:100%;" onclick="formPedido()">Continuar →</button>`;
    }
    function formPedido(){
      const c = leer(K_CLIENTE) || {}, n = CFG.negocio;
      $('tituloCarro').textContent = 'Tus datos';
      $('cuerpoCarro').innerHTML = `
        <div class="resumen">${CARRO.map(x => { const p = PRODS.find(y => y.id === x.id); return `<div><span>${x.cantidad}× ${esc(p.nombre)}</span><span>${clp(precioDe(p) * x.cantidad)}</span></div>`; }).join('')}
          <div style="border-top:1px solid var(--borde);margin-top:6px;padding-top:6px;font-weight:800;"><span>Total</span><span>${clp(totalCarro())}</span></div></div>
        <label class="l" for="pNombre">Nombre y apellido</label><input class="campo" id="pNombre" autocomplete="name" value="${esc(c.nombre || '')}">
        <label class="l" for="pTel">WhatsApp</label><div class="tel"><span>+56</span><input class="campo" id="pTel" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="9 1234 5678" value="${esc(c.tel || '9 ')}"></div>
        <label class="l">¿Cómo lo recibes?</label>
        <div class="opciones"><button class="opcion ${ENTREGA === 'retiro' ? 'sel' : ''}" data-e="retiro" onclick="elegirEntrega('retiro')">🏪 Retiro<small>en el local</small></button>
          <button class="opcion ${ENTREGA === 'despacho' ? 'sel' : ''}" data-e="despacho" onclick="elegirEntrega('despacho')">🚚 Despacho<small>a domicilio</small></button></div>
        <div id="cajaDir" class="${ENTREGA === 'despacho' ? '' : 'oculto'}"><label class="l" for="pDir">Dirección de despacho</label><input class="campo" id="pDir" autocomplete="street-address" placeholder="Calle, número, comuna" value="${esc(c.dir || '')}"></div>
        <label class="l" for="pNota">Comentario (opcional)</label><textarea class="campo" id="pNota" rows="2" placeholder="Ej: color, talla, horario para recibir…"></textarea>
        ${n.tienda_info ? `<p style="color:var(--gris);font-size:12.5px;margin-top:12px;white-space:pre-line;">ℹ️ ${esc(n.tienda_info)}</p>` : ''}`;
      $('pieCarro').innerHTML = `<div class="total"><span>Total</span><b>${clp(totalCarro())}</b></div>
        <p class="error" id="errPedido" style="margin:0 0 8px;min-height:0;"></p>
        <div style="display:flex;gap:8px;"><button class="boton sec" onclick="dibujarCarro()">←</button>
        <button class="boton" style="flex:1;" id="btnEnviar" onclick="enviarPedido()">Enviar pedido</button></div>
        <p style="color:var(--gris);font-size:12px;margin-top:8px;text-align:center;">El negocio confirma disponibilidad y forma de pago por WhatsApp.</p>`;
    }
    function elegirEntrega(e){
      ENTREGA = e; document.querySelectorAll('.opcion').forEach(b => b.classList.toggle('sel', b.dataset.e === e));
      $('cajaDir').classList.toggle('oculto', e !== 'despacho');
    }
    async function enviarPedido(){
      if (ENVIANDO) return;
      const nombre = $('pNombre').value.trim(), dig = $('pTel').value.replace(/\D/g, ''), dir = ($('pDir')?.value || '').trim();
      const err = t => { $('errPedido').textContent = t; };
      if (nombre.length < 2) return err('Escribe tu nombre.');
      if (!/^9\d{8}$/.test(dig)) return err('Revisa tu WhatsApp: son 9 dígitos y parte con 9.');
      if (ENTREGA === 'despacho' && dir.length < 5) return err('Escribe la dirección de despacho.');
      const tel = `+56 ${dig.slice(0, 1)} ${dig.slice(1, 5)} ${dig.slice(5)}`;
      ENVIANDO = true; $('btnEnviar').disabled = true; $('btnEnviar').textContent = 'Enviando…'; err('');
      const resumen = CARRO.map(x => { const p = PRODS.find(y => y.id === x.id); return { nombre: p.nombre, cantidad: x.cantidad, subtotal: precioDe(p) * x.cantidad }; });
      const { data, error } = await db.rpc('crear_pedido', { p: { negocio: SLUG || null, nombre, telefono: tel, entrega: ENTREGA, direccion: dir,
        nota: $('pNota').value.trim(), items: CARRO.map(x => ({ id: x.id, cantidad: x.cantidad })) } });
      ENVIANDO = false;
      if (error){ $('btnEnviar').disabled = false; $('btnEnviar').textContent = 'Enviar pedido'; return err(error.message); }
      guardar(K_CLIENTE, { nombre, tel: `${dig.slice(0, 1)} ${dig.slice(1, 5)} ${dig.slice(5)}`, dir: ENTREGA === 'despacho' ? dir : ((leer(K_CLIENTE) || {}).dir || '') });
      CARRO = []; guardar(K_CARRO, CARRO); pintarContador();
      const n = CFG.negocio, wsp = (data.whatsapp || n.whatsapp || '').replace(/\D/g, '');
      const msg = `Hola ${n.nombre}, hice el pedido #${data.numero} en su tienda online:\n` + resumen.map(r => `• ${r.cantidad}× ${r.nombre} — ${clp(r.subtotal)}`).join('\n')
        + `\nTotal: ${clp(data.total)}\nEntrega: ${ENTREGA === 'despacho' ? 'Despacho a ' + dir : 'Retiro en el local'}\nA nombre de: ${nombre}`;
      $('tituloCarro').textContent = 'Pedido enviado';
      $('cuerpoCarro').innerHTML = `<div class="ok-ped"><div class="check">✓</div><h3>¡Pedido #${data.numero} recibido!</h3>
          <p>${esc(n.nombre)} ya lo ve en su panel. ${wsp ? 'Avísales por WhatsApp para que te confirmen más rápido.' : 'Te contactarán para confirmar.'}</p>
          <div class="resumen">${resumen.map(r => `<div><span>${r.cantidad}× ${esc(r.nombre)}</span><span>${clp(r.subtotal)}</span></div>`).join('')}
            <div style="border-top:1px solid var(--borde);margin-top:6px;padding-top:6px;font-weight:800;"><span>Total</span><span>${clp(data.total)}</span></div></div></div>`;
      $('pieCarro').innerHTML = `${wsp ? `<a class="boton wsp" style="width:100%;" href="https://wa.me/${wsp}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">💬 Enviar por WhatsApp</a>` : ''}
        <button class="boton sec" style="width:100%;margin-top:8px;" onclick="cerrarCarro()">Seguir comprando</button>`;
      // el stock pudo cambiar: se recarga el catálogo en silencio
      db.rpc('tienda_config', { p_negocio: SLUG || null }).then(r => { if (!r.error && r.data.productos){ PRODS = r.data.productos; dibujarGrilla(); } });
    }

    let db;
    if (typeof supabase === 'undefined' || !SUPABASE_URL) aviso('Sin conexión', 'No se pudo cargar la página. Revisa tu internet y vuelve a intentar.');
    else { db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); iniciar(); }
  </script>
</body>
</html>
