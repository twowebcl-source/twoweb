<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Reserva tu hora</title>
  <link rel="icon" href="data:,">
  <script src="config.js"></script>
  <script src="fondos.js"></script>
  <script src="fidelidad.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --voltaje:#ff7a2f; }
    /* ===== TEMAS (Fase 12): colores, formas y letras. El tema se elige en el panel ===== */
    :root { --fondo:#111318; --panel:#1b1e25; --panel2:#232730; --hueso:#f1eee8; --gris:#9aa0a8;
      --borde:color-mix(in srgb, var(--hueso) 9%, transparent); --verde:#4ade80; --rojo:#f87171; --azul:#60a5fa; --rojo-suave:#fca5a5;
      --esquema:dark; --r:16px; --r-s:10px; --r-pill:999px; --r-foto:50%; --r-paso:50%; --r-check:7px; --r-cita:7px;
      --fuente:'Inter',system-ui,-apple-system,sans-serif; --fuente-tit:inherit; --sobre:#111;
      --voltaje-suave:color-mix(in srgb, var(--voltaje) 13%, transparent); }
    html[data-tema="burbuja"] { --fondo:#131726; --panel:#1c2135; --panel2:#262c44; --hueso:#eef1fb; --gris:#9aa3bf;
      --borde:color-mix(in srgb, var(--hueso) 8%, transparent); --verde:#4ade80; --rojo:#f87171; --azul:#60a5fa; --rojo-suave:#fca5a5;
      --esquema:dark; --r:28px; --r-s:18px; --r-pill:999px; --r-foto:50%; --r-paso:50%; --r-check:50%; --r-cita:12px;
      --fuente:'Nunito',system-ui,sans-serif; --fuente-tit:'Nunito',system-ui,sans-serif; }
    html[data-tema="vintage"] { --fondo:#efe6d6; --panel:#fbf6ec; --panel2:#f1e7d4; --hueso:#2a1f16; --gris:#76644f;
      --borde:color-mix(in srgb, var(--hueso) 22%, transparent); --verde:#2f7d3b; --rojo:#b3261e; --azul:#1d4e89; --rojo-suave:#9b1c1c;
      --esquema:light; --r:3px; --r-s:2px; --r-pill:3px; --r-foto:50%; --r-paso:50%; --r-check:2px; --r-cita:2px;
      --fuente:Georgia,'Times New Roman',serif; --fuente-tit:'Playfair Display',Georgia,serif; }
    html[data-tema="neon"] { --fondo:#07080c; --panel:#0e1017; --panel2:#161a24; --hueso:#f4f6ff; --gris:#8a93a8;
      --borde:color-mix(in srgb, var(--hueso) 11%, transparent); --verde:#39ff88; --rojo:#ff4d6d; --azul:#4dd8ff; --rojo-suave:#ff8fa3;
      --esquema:dark; --r:0px; --r-s:0px; --r-pill:0px; --r-foto:0px; --r-paso:0px; --r-check:0px; --r-cita:0px;
      --fuente:system-ui,-apple-system,sans-serif; --fuente-tit:'Oswald',Impact,sans-serif; }
    html[data-tema="minimal"] { --fondo:#f4f5f7; --panel:#ffffff; --panel2:#f0f1f4; --hueso:#14161b; --gris:#6b7280;
      --borde:color-mix(in srgb, var(--hueso) 11%, transparent); --verde:#15803d; --rojo:#dc2626; --azul:#2563eb; --rojo-suave:#b91c1c;
      --esquema:light; --r:12px; --r-s:8px; --r-pill:999px; --r-foto:50%; --r-paso:50%; --r-check:6px; --r-cita:6px;
      --fuente:'Inter',system-ui,-apple-system,sans-serif; --fuente-tit:'Inter',system-ui,sans-serif; }
    html[data-tema="organico"] { --fondo:#171512; --panel:#221f1a; --panel2:#2d2923; --hueso:#f3ebe0; --gris:#a99d8d;
      --borde:color-mix(in srgb, var(--hueso) 10%, transparent); --verde:#8fd18a; --rojo:#f08a7a; --azul:#8fb8de; --rojo-suave:#f5b1a5;
      --esquema:dark; --r:28px 8px 28px 8px; --r-s:16px 5px 16px 5px; --r-pill:18px 6px 18px 6px; --r-foto:58% 42% 55% 45% / 50% 58% 42% 50%; --r-paso:60% 40% 55% 45% / 55% 45% 55% 45%; --r-check:8px 3px; --r-cita:12px 3px 12px 3px;
      --fuente:system-ui,-apple-system,sans-serif; --fuente-tit:'Fraunces',Georgia,serif; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { background:var(--fondo); color:var(--hueso); font-family:'Inter',system-ui,-apple-system,sans-serif; line-height:1.45; padding-bottom:110px; }
    .oculto { display:none !important; }
    button { font-family:inherit; }
    .caja { max-width:760px; margin:0 auto; padding:0 16px; }

    /* ---------- CABECERA ---------- */
    header { border-bottom:1px solid var(--borde); background:color-mix(in srgb, var(--fondo) 92%, transparent); backdrop-filter:blur(8px); position:sticky; top:0; z-index:20; }
    .cab { display:flex; align-items:center; justify-content:space-between; height:58px; }
    .marca { font-weight:800; font-size:19px; letter-spacing:.3px; }
    .marca span { color:var(--voltaje); }
    .cab-link { background:none; border:1px solid var(--borde); color:var(--hueso); padding:7px 14px; border-radius:var(--r-pill); font-size:13px; cursor:pointer; }
    .cab-link:hover { border-color:var(--voltaje); }

    /* ---------- STEPPER ---------- */
    .stepper { display:flex; justify-content:space-between; margin:22px 0 18px; position:relative; }
    .stepper::before { content:''; position:absolute; top:15px; left:8%; right:8%; height:2px; background:var(--panel2); }
    .st { position:relative; flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; color:var(--gris); cursor:default; }
    .st-num { width:32px; height:32px; border-radius:var(--r-paso); background:var(--panel2); border:2px solid var(--panel2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:var(--gris); transition:all .25s; }
    .st-txt { font-size:10.5px; font-weight:700; letter-spacing:.8px; }
    .st.hecho { cursor:pointer; color:var(--hueso); }
    .st.hecho .st-num { background:var(--voltaje-suave); border-color:var(--voltaje); color:var(--voltaje); }
    .st.actual { color:var(--voltaje); }
    .st.actual .st-num { background:var(--voltaje); border-color:var(--voltaje); color:var(--sobre); box-shadow:0 0 0 5px color-mix(in srgb, var(--voltaje) 18%, transparent); }

    .contexto { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px; min-height:30px; }
    .pill { display:inline-flex; align-items:center; gap:6px; background:var(--voltaje-suave); color:var(--voltaje); border:1px solid color-mix(in srgb, var(--voltaje) 35%, transparent);
            padding:5px 12px; border-radius:var(--r-pill); font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; }
    .pill button { background:none; border:none; color:var(--hueso); text-decoration:underline; font-size:11px; cursor:pointer; text-transform:none; letter-spacing:0; font-weight:500; }
    .pill.persona { background:var(--panel2); color:var(--hueso); border-color:var(--borde); }
    .subtitulo { color:var(--gris); font-size:13px; }

    /* ---------- CAPAS (pasos) ---------- */
    .capa { animation:entra .28s ease; }
    @keyframes entra { from { opacity:0; transform:translateX(18px); } to { opacity:1; transform:none; } }
    .capa.atras { animation:sale .28s ease; }
    @keyframes sale { from { opacity:0; transform:translateX(-18px); } to { opacity:1; transform:none; } }
    h2 { font-size:22px; margin:6px 0 4px; }
    .ayuda { color:var(--gris); font-size:14px; margin-bottom:18px; }
    .volver { background:none; border:none; color:var(--gris); font-size:13px; cursor:pointer; padding:4px 0; margin-bottom:6px; }
    .volver:hover { color:var(--hueso); }
    .aviso { color:var(--rojo); font-size:14px; margin:10px 0; }
    .nota { color:var(--gris); font-size:12.5px; }
    .cat { font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--voltaje); margin:22px 0 10px; display:flex; align-items:center; gap:10px; }
    .cat::after { content:''; flex:1; height:1px; background:var(--borde); }

    /* Sucursal */
    .locales { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; }
    .local { text-align:left; background:var(--panel); border:1px solid var(--borde); border-radius:var(--r); padding:20px; cursor:pointer; color:var(--hueso); transition:all .2s; position:relative; overflow:hidden; }
    .local:hover { border-color:var(--voltaje); transform:translateY(-2px); }
    .local.sel { border-color:var(--voltaje); background:var(--voltaje-suave); }
    .local-ic { width:44px; height:44px; border-radius:var(--r-s); background:var(--voltaje-suave); color:var(--voltaje); display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:12px; }
    .local b { display:block; font-size:18px; }
    .local .dir { color:var(--gris); font-size:13.5px; margin-top:2px; }
    .local .ref { font-size:12.5px; margin-top:6px; color:var(--hueso); }
    .local .pie-local { display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-size:12.5px; color:var(--gris); }
    .local a { color:var(--voltaje); text-decoration:none; font-weight:600; }

    /* Personas */
    .personas { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--panel); border:1px solid var(--borde); border-radius:var(--r); padding:12px 14px; }
    .personas span { font-size:14px; margin-right:auto; }
    .chip { background:var(--panel2); border:1px solid var(--borde); color:var(--hueso); padding:8px 14px; border-radius:var(--r-pill); cursor:pointer; font-size:13.5px; }
    .chip.sel { background:var(--voltaje); border-color:var(--voltaje); color:var(--sobre); font-weight:700; }

    /* Servicios */
    .servicios { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:10px; }
    .serv { display:flex; gap:12px; align-items:flex-start; text-align:left; background:var(--panel); border:1px solid var(--borde); border-radius:var(--r); padding:14px; cursor:pointer; color:var(--hueso); transition:all .15s; }
    .serv:hover { border-color:color-mix(in srgb, var(--voltaje) 60%, transparent); }
    .serv.sel { border-color:var(--voltaje); background:var(--voltaje-suave); }
    .serv.no { opacity:.35; cursor:not-allowed; }
    .serv-check { width:22px; height:22px; border-radius:var(--r-check); border:2px solid var(--gris); flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:var(--sobre); }
    .serv.sel .serv-check { background:var(--voltaje); border-color:var(--voltaje); }
    .serv-info { flex:1; min-width:0; }
    .serv-nom { font-weight:700; font-size:15px; }
    .serv-desc { color:var(--gris); font-size:12.5px; margin-top:2px; }
    .precio .antes { color:var(--gris); font-weight:500; font-size:.85em; margin-right:4px; }
    .serv-meta { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
    .dur { font-size:12px; color:var(--gris); background:var(--panel2); padding:3px 9px; border-radius:var(--r-pill); }
    .precio { font-weight:800; font-size:16px; }

    /* Barberos */
    .barberos { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
    .barbero { background:var(--panel); border:1px solid var(--borde); border-radius:var(--r); padding:18px 12px 16px; cursor:pointer; color:var(--hueso); text-align:center; transition:all .2s; }
    .barbero:hover { border-color:var(--voltaje); transform:translateY(-2px); }
    .barbero.sel { border-color:var(--voltaje); background:var(--voltaje-suave); }
    .foto { width:76px; height:76px; border-radius:var(--r-foto); margin:0 auto 10px; background:var(--panel2) center/cover no-repeat; display:flex; align-items:center; justify-content:center;
            font-size:28px; font-weight:800; color:var(--voltaje); border:2px solid var(--borde); }
    .barbero.cualquiera .foto { background:linear-gradient(135deg, var(--voltaje), color-mix(in srgb, var(--voltaje) 55%, #fff)); color:var(--sobre); border:none; }
    .barbero b { display:block; font-size:15px; }
    .barbero small { color:var(--gris); font-size:12px; }

    /* Fecha y hora */
    .dias { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; scroll-snap-type:x mandatory; }
    .dias::-webkit-scrollbar { height:5px; } .dias::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--hueso) 15%, transparent); border-radius:3px; }
    .dia { flex-shrink:0; width:70px; scroll-snap-align:start; background:var(--panel); border:1px solid var(--borde); border-radius:var(--r); padding:10px 0 9px; text-align:center; cursor:pointer; color:var(--hueso); }
    .dia:hover { border-color:var(--voltaje); }
    .dia.sel { background:var(--voltaje); border-color:var(--voltaje); color:var(--sobre); }
    .dia.off { opacity:.3; cursor:not-allowed; }
    .dia-top { font-size:10.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; }
    .dia-num { font-size:22px; font-weight:800; line-height:1.15; }
    .dia-mes { font-size:11px; text-transform:uppercase; opacity:.8; }
    .dia.sel .dia-top, .dia.sel .dia-mes { opacity:1; }
    .otra { display:flex; align-items:center; gap:10px; margin:6px 0 18px; flex-wrap:wrap; }
    .otra button { background:none; border:1px dashed color-mix(in srgb, var(--hueso) 25%, transparent); color:var(--hueso); padding:8px 14px; border-radius:var(--r-s); cursor:pointer; font-size:13px; }
    .cal { background:var(--panel); border:1px solid var(--borde); border-radius:var(--r); padding:12px; margin:0 0 16px; max-width:380px; }
    .cal-cab { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .cal-cab b { text-transform:capitalize; }
    .cal-cab button { width:34px; height:34px; border-radius:50%; border:1px solid var(--borde); background:var(--panel2); color:var(--hueso); font-size:18px; cursor:pointer; }
    .cal-cab button:disabled { opacity:.3; cursor:default; }
    .cal-sem, .cal-dias { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; text-align:center; }
    .cal-sem span { font-size:11px; color:var(--gris); padding:4px 0; }
    .cd { aspect-ratio:1; border-radius:var(--r-s); border:1px solid transparent; background:var(--panel2); color:var(--hueso); font:600 14px inherit; cursor:pointer; font-family:inherit; }
    .cd:hover { border-color:var(--voltaje); }
    .cd.hoy { border-color:color-mix(in srgb, var(--voltaje) 50%, transparent); }
    .cd.sel { background:var(--voltaje); color:var(--sobre, #111); border-color:var(--voltaje); }
    .cd.off { background:none; color:color-mix(in srgb, var(--hueso) 25%, transparent); cursor:default; text-decoration:line-through; text-decoration-color:color-mix(in srgb, var(--hueso) 15%, transparent); }
    .otra .nota { font-size:12px; color:var(--gris); }
    .otra input { background:var(--panel2); border:1px solid var(--borde); color:var(--hueso); border-radius:var(--r-s); padding:8px 10px; font-family:inherit; color-scheme:var(--esquema); }
    .tabs { display:flex; gap:6px; margin-bottom:12px; }
    .tab { flex:1; background:var(--panel); border:1px solid var(--borde); color:var(--gris); padding:10px; border-radius:var(--r-s); cursor:pointer; font-size:14px; font-weight:600; }
    .tab b { color:var(--hueso); margin-left:4px; background:var(--panel2); padding:1px 8px; border-radius:var(--r-pill); font-size:12px; }
    .tab.sel { border-color:var(--voltaje); color:var(--hueso); background:var(--voltaje-suave); }
    .tab.sel b { background:var(--voltaje); color:var(--sobre); }
    .tab:disabled { opacity:.4; cursor:not-allowed; }
    .horas { display:grid; grid-template-columns:repeat(auto-fill, minmax(82px, 1fr)); gap:8px; }
    .hora { background:var(--panel); border:1px solid var(--borde); color:var(--hueso); border-radius:var(--r-s); padding:11px 4px; cursor:pointer; font-size:15px; font-weight:600; }
    .hora small { display:block; font-size:10.5px; color:var(--gris); font-weight:500; margin-top:1px; }
    .hora:hover { border-color:var(--verde); }
    .hora.sel { background:var(--verde); border-color:var(--verde); color:var(--fondo); }
    .hora.sel small { color:var(--fondo); }
    .vacio { background:var(--panel); border:1px dashed var(--borde); border-radius:var(--r); padding:22px; text-align:center; color:var(--gris); font-size:14px; }

    /* Datos */
    .tarjeta { background:var(--panel); border:1px solid var(--borde); border-radius:var(--r); padding:18px; margin-bottom:14px; }
    .tarjeta h3 { font-size:14px; margin-bottom:12px; color:var(--gris); font-weight:600; text-transform:uppercase; letter-spacing:.8px; }
    .res-item { padding:10px 0; border-bottom:1px solid var(--borde); font-size:14px; }
    .res-item:last-child { border-bottom:none; padding-bottom:0; }
    .res-item:first-child { padding-top:0; }
    .res-linea { display:flex; justify-content:space-between; gap:12px; }
    .res-linea .g { color:var(--gris); }
    .link { background:none; border:none; color:var(--voltaje); cursor:pointer; font-size:12.5px; text-decoration:underline; }
    .fila2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    label.lbl { display:block; font-size:12.5px; color:var(--gris); margin:0 0 5px; font-weight:600; }
    .campo { margin-bottom:12px; }
    input, textarea, select { width:100%; background:var(--panel2); border:1px solid var(--borde); border-radius:var(--r-s); padding:12px 13px; color:var(--hueso); font-size:15px; font-family:inherit; }
    select { cursor:pointer; color-scheme:var(--esquema); }
    input:focus, textarea:focus, select:focus { outline:none; border-color:var(--voltaje); }
    textarea { min-height:76px; resize:vertical; }
    .junto { display:flex; }
    .junto > :first-child { border-radius:10px 0 0 10px; }
    .junto > :last-child { border-radius:0 10px 10px 0; border-left:none; }
    .junto select { width:auto; flex-shrink:0; }
    .junto input { flex:1; min-width:0; }
    .check { display:flex; gap:10px; align-items:flex-start; font-size:14px; cursor:pointer; margin:4px 0 14px; }
    .check input { width:20px; height:20px; accent-color:var(--voltaje); flex-shrink:0; margin-top:1px; }
    .subir { display:flex; align-items:center; gap:12px; background:var(--panel2); border:1px dashed color-mix(in srgb, var(--hueso) 22%, transparent); border-radius:var(--r-s); padding:12px; cursor:pointer; font-size:14px; }
    .subir:hover { border-color:var(--voltaje); }
    .subir img { width:56px; height:56px; object-fit:cover; border-radius:8px; }
    .subir .ic { width:56px; height:56px; border-radius:8px; background:var(--panel); display:flex; align-items:center; justify-content:center; font-size:24px; }
    .total { display:flex; justify-content:space-between; align-items:center; background:var(--voltaje-suave); border:1px solid color-mix(in srgb, var(--voltaje) 35%, transparent); border-radius:var(--r); padding:16px 18px; margin:6px 0 14px; }
    .total strong { font-size:24px; color:var(--voltaje); }
    .total small { display:block; color:var(--gris); font-size:12.5px; }
    .boton { width:100%; background:var(--voltaje); color:var(--sobre); border:none; border-radius:var(--r-s); padding:15px; font-size:16px; font-weight:800; cursor:pointer; }
    .boton:disabled { opacity:.45; cursor:not-allowed; }
    .boton.sec { background:var(--panel2); color:var(--hueso); border:1px solid var(--borde); font-weight:600; }
    .estado { font-size:14px; margin-top:10px; min-height:20px; color:var(--rojo); }

    /* Barra inferior fija */
    .barra { position:fixed; left:0; right:0; bottom:0; z-index:30; background:color-mix(in srgb, var(--panel) 97%, transparent); backdrop-filter:blur(8px); border-top:1px solid var(--borde); transform:translateY(110%); visibility:hidden; transition:transform .25s, visibility .25s; }
    .barra.ver { transform:none; visibility:visible; }
    .barra .caja { display:flex; align-items:center; gap:14px; padding-top:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
    .barra-txt { flex:1; min-width:0; font-size:13px; color:var(--gris); }
    .barra-txt b { display:block; color:var(--hueso); font-size:15px; }
    .barra-txt .mal { color:var(--rojo); }
    .barra .boton { width:auto; padding:13px 22px; font-size:15px; white-space:nowrap; }

    /* Confirmación */
    .listo { text-align:center; padding-top:10px; }
    .ok { width:68px; height:68px; border-radius:50%; background:var(--verde); color:var(--fondo); font-size:34px; font-weight:800; display:flex; align-items:center; justify-content:center; margin:10px auto 14px; animation:pop .4s ease; }
    @keyframes pop { 0% { transform:scale(.4); } 80% { transform:scale(1.1); } 100% { transform:scale(1); } }
    .item-res { background:var(--panel); border:1px solid var(--borde); border-radius:var(--r); padding:14px 16px; margin-top:10px; text-align:left; font-size:14px; }
    .item-res b { color:var(--voltaje); }
    .item-res.cancelada { opacity:.55; }
    .item-res .est-cancelada { color:#f87171; font-weight:700; }

  <div class="barra" id="barra"><div class="caja"><div class="barra-txt" id="barraTxt"></div><button class="boton" id="barraBtn">Continuar</button></div></div>

  <script>
    const CONF = window.TWOWEB || {};
    const SUPABASE_URL = CONF.SUPABASE_URL, SUPABASE_KEY = CONF.SUPABASE_KEY;   // se configuran en config.js
    // ¿De qué barbería es esta agenda?  1) su dominio propio (minadeoro.cl/agenda.html)  2) agenda.html?b=link-del-negocio
    //   (sin nada = negocio principal TwoWeb)
    const QS = new URLSearchParams(location.search);
    const HOST = location.hostname.toLowerCase().replace(/^www\./, '');
    const DOMINIO_PROPIO = /\./.test(HOST) && !/^\d+(\.\d+){3}$/.test(HOST) &&
      !/(^|\.)(twoweb\.cl|github\.dev|github\.io|pages\.dev|githubpreview\.dev)$/.test(HOST) ? HOST : '';
    const SLUG = (QS.get('b') || QS.get('negocio') || DOMINIO_PROPIO || '').trim().toLowerCase();
    const PRINCIPAL = CONF.PRINCIPAL || 'twoweb';                 // el aviso por Formspree y el link a la página de inicio son solo del principal
    // Si se llegó por el link corto (twoweb.cl/minadeoro/reservar) se deja esa dirección bonita en la barra
    function urlCorta(sufijo){
      if (!QS.has('_c') || !SLUG || DOMINIO_PROPIO) return undefined;
      const b = document.createElement('base'); b.href = '/'; document.head.prepend(b);
      return '/' + SLUG + (sufijo ? '/' + sufijo : '');
    }
    const K_TEMA = 'twoweb-tema-' + (SLUG || PRINCIPAL);
    const K_INSCRITO = 'twoweb-inscrito' + (SLUG && SLUG !== PRINCIPAL ? '-' + SLUG : '');

    const PASO_MIN = 15;          // las horas se ofrecen cada 15 minutos
    const MAX_PERSONAS = 3;
    const DIAS_TIRA = 14;         // días visibles en la tira
    const DIAS_ADELANTE = 120;
    const AUTO = "auto";          // "Cualquiera disponible"
    const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    // Palabras del rubro de cada negocio (Barbero, Estilista, Manicurista, Profesional…)
    const PRO  = () => CFG.negocio?.pro  || 'Profesional';
    const PROS = () => CFG.negocio?.pros || 'Profesionales';
    const pro = () => PRO().toLowerCase(), pros = () => PROS().toLowerCase();
    const esBarberia = () => /^barber/i.test(PRO());
    // Orden: 1 local · 2 profesional · 3 servicio · 4 fecha · 6 productos (opcional) · 5 datos
    const NOMBRE_PASO = () => ({ 1:'Local', 2:PRO(), 3:'Servicio', 4:'Fecha', 6:'Tienda', 5:'Datos' });
    const conProds = () => !!(CFG.negocio?.tienda_tras_reserva && (CFG.productos_reserva || []).length);
    const ORDEN = () => [...(FIJO ? [] : [1, 2]), 3, 4, ...(conProds() ? [6] : []), 5];
    const pos_ = k => ORDEN().indexOf(k);
    // Link personal de cada profesional: /negocio/pedro  o  agenda.html?b=negocio&con=pedro
    const slugTxt = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    function slugTrab(t){ const b = slugTxt(t.nombre); return CFG.trabajadores.filter(x => slugTxt(x.nombre) === b).length > 1 ? b + '-' + t.id : b; }
    let FIJO = null;              // profesional fijo cuando se entra por su link personal
    const DOMINIOS = ['@gmail.com', '@hotmail.com', '@outlook.com', '@yahoo.com', '@icloud.com', '@live.cl'];
    const PAISES = [['+56','🇨🇱 +56'],['+54','🇦🇷 +54'],['+51','🇵🇪 +51'],['+57','🇨🇴 +57'],['+58','🇻🇪 +58'],['+593','🇪🇨 +593'],
                    ['+591','🇧🇴 +591'],['+595','🇵🇾 +595'],['+598','🇺🇾 +598'],['+55','🇧🇷 +55'],['+1','🇺🇸 +1'],['+34','🇪🇸 +34']];

    const clp = x => "$" + Number(x||0).toLocaleString("es-CL");
    const aMin = hhmm => { const [h,m] = hhmm.split(':').map(Number); return h*60+m; };

    const hoyTxt = () => CFG.ahora.split('T')[0];
    const guardarLocal = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

    function nuevoDraft(){ return { servicios:[], eleccion:null, tid:null, fecha:'', t:null }; }

    // ---------- LO QUE HAY EN LA SUCURSAL ----------
    const localSel   = () => CFG.locales.find(l => l.id === LOCAL);
    const trabsLocal = () => CFG.trabajadores.filter(t => t.local_id === LOCAL);
    const servsLocal = () => CFG.servicios.filter(s => s.local_id === LOCAL && trabsLocal().some(t => t.servicios.includes(s.id)));
    const prosLocal  = () => trabsLocal().filter(t => t.servicios.some(id => CFG.servicios.some(s => s.id === id && s.local_id === LOCAL)));
    const aptos      = ids => trabsLocal().filter(t => ids.every(id => t.servicios.includes(id)));   // barberos que hacen TODOS esos servicios
    const trab       = id => CFG.trabajadores.find(t => t.id === id);
    const nombreTrab = id => trab(id)?.nombre || '';
    const servDe  = c => CFG.servicios.filter(s => c.servicios.includes(s.id));
    const durDe   = c => servDe(c).reduce((a,s) => a + s.duracion, 0);
    const totalDe = c => servDe(c).reduce((a,s) => a + s.precio, 0);
    const persona = () => citas.length;                    // índice de la persona que se está eligiendo
    const etiqueta = i => n === 1 ? '' : (i === 0 ? 'Persona 1 (tú)' : `Persona ${i+1}`);

    // ---------- CARGA ----------
    let CUMPLE = null;
    let DIAS_LIMITE = DIAS_ADELANTE;   // hasta cuántos días adelante se puede reservar (lo elige el admin, Fase 45)
    let calMes = null, calAbierto = false;
    const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];   // tarjeta de cumpleaños activa del negocio (Fase 39)
    async function iniciar(){
      rpcNeg('cumple_config', { p_negocio: SLUG || null }).then(r => { if (r && !r.error) CUMPLE = r.data; }, () => {});
      db.rpc('agenda_limite', { p_negocio: SLUG || null }).then(r => { if (r && !r.error && r.data > 0) DIAS_LIMITE = r.data; }, () => {});   // Fase 45
      const { data, error } = await rpcNeg('agenda_config', { p_negocio: SLUG || null });
      if (error){
        $('vista').innerHTML = (error.message || '').includes('NEGOCIO_NO_EXISTE')
          ? '<div class="vacio" style="margin-top:20px;">Esta agenda no existe. Revisa el link que te enviaron.</div>'
          : `<p class="aviso">No pudimos cargar la agenda: ${esc(error.message)}${/schema cache/i.test(error.message || '') ? '<br><br>👉 Falta instalar en Supabase el archivo <b>INSTALAR-FASES-7-a-10</b>.' : ''}</p>`;
        $('stepper').innerHTML = ''; return;
      }
      if (data.suspendido){
        pintarMarca(data.negocio || {});
        $('stepper').innerHTML = '';
        $('vista').innerHTML = `<div class="vacio" style="margin-top:20px;">La agenda online de <b>${esc(data.negocio?.nombre || '')}</b> no está disponible por ahora.
          ${data.negocio?.whatsapp ? `<br><br><a class="boton" style="display:inline-block;width:auto;text-decoration:none;" href="https://wa.me/${esc(data.negocio.whatsapp.replace(/\D/g, ''))}">Escríbenos por WhatsApp</a>` : ''}</div>`;
        return;
      }
      // Negocio sin agenda online (solo tienda): se avisa y se lleva a su tienda
      if (data.negocio && data.negocio.mod_agenda === false){
        pintarMarca(data.negocio); $('stepper').innerHTML = '';
        const tUrl = QS.has('_c') && SLUG && !DOMINIO_PROPIO ? '/' + SLUG + '/tienda' : 'tienda.html' + (SLUG && !DOMINIO_PROPIO ? '?b=' + encodeURIComponent(SLUG) : '');
        $('vista').innerHTML = `<div class="vacio" style="margin-top:20px;"><b>${esc(data.negocio.nombre || '')}</b> no tiene agenda online.
          ${data.negocio.mod_tienda ? `<br><br><a class="boton" style="display:inline-block;width:auto;text-decoration:none;" href="${tUrl}">🛍 Ir a la tienda</a>` : ''}</div>`;
        return;
      }
      CFG = data;
      pintarMarca(CFG.negocio || {});
      CFG.locales = CFG.locales || [];
      CFG.trabajadores.forEach(t => t.servicios = t.servicios || []);
      datosCliente = leerLocal('twoweb-cliente') || {};
      // ?local=2 (o ?local=centro) deja la sucursal elegida: sirve para links de Instagram de cada local
      const q = QS.get('local'), con = (QS.get('con') || QS.get('pro') || '').toLowerCase();
      const pre = q && CFG.locales.find(l => String(l.id) === q || l.nombre.toLowerCase() === q.toLowerCase());
      const tFijo = con && CFG.trabajadores.find(t => String(t.id) === con || slugTrab(t) === con || slugTxt(t.nombre) === con || slugTxt(t.nombre) + '-' + t.id === con);
      if (tFijo) { FIJO = tFijo.id; LOCAL = tFijo.local_id; paso = inicioPersona(); }
      else if (pre) { LOCAL = pre.id; paso = inicioPersona(); }
      else if (CFG.locales.length === 1) { LOCAL = CFG.locales[0].id; paso = inicioPersona(); }
      if (con && !tFijo) setTimeout(() => $('contexto').insertAdjacentHTML('afterbegin', `<span class="pill">No encontramos a "${esc(con)}": elige con quién atenderte</span>`), 0);
      history.replaceState({ paso, i: 0 }, '', urlCorta(FIJO ? slugTrab(trab(FIJO)) : 'reservar'));
      dibujar();
      if (promoActiva() && QS.has('inscribete')) verInscripcion();   // link directo: agenda.html?inscribete
      if (QS.get('mis') || QS.get('confirmar')) abrirDesdeCorreo();
      else if (QS.has('mis_reservas')) verMisReservas();                // link "Mis reservas" de la tienda y de la página del negocio   // botones del correo: "Cancelar mi hora" / "Confirmo que voy"
    }

    // Llamada a la base con respaldo: si la base aún no tiene la Fase 10, se vuelve a intentar sin el negocio
    async function rpcNeg(nombre, args){
      let r = await db.rpc(nombre, args);
      if (r.error && 'p_negocio' in args && (r.error.code === 'PGRST202' || /schema cache/i.test(r.error.message || ''))){
        const { p_negocio, ...resto } = args;
        if (!p_negocio) r = await db.rpc(nombre, resto);
      }
      return r;
    }
    // Nombre, logo y color de la barbería dueña de esta agenda
    function pintarMarca(n){
      const nombre = n.nombre || CONF.MARCA || 'TwoWeb';
      document.title = 'Reserva tu hora — ' + nombre;
      const m = $('marca');
      if (typeof iconoNegocioPublico === 'function') iconoNegocioPublico(n);          // pestaña: logo del local (o su inicial)
      if (n.logo_url) {
        m.innerHTML = `<img src="${esc(n.logo_url)}" alt="" style="height:36px;width:36px;object-fit:contain;border-radius:9px;vertical-align:middle;margin-right:8px;">${esc(nombre)}`;
      }
      else if (nombre === 'TwoWeb') m.innerHTML = 'Two<span>Web</span>';
      else m.textContent = nombre;
      // el logo lleva a la página web de la barbería (en su dominio: la portada; si no: barberia.html?b=...)
      if ((n.slug || PRINCIPAL) !== PRINCIPAL){ m.href = DOMINIO_PROPIO ? './' : QS.has('_c') ? '/' + n.slug : 'barberia.html?b=' + encodeURIComponent(n.slug); m.title = 'Ir a la página de ' + nombre; }
      document.querySelectorAll('.nombreNeg').forEach(e => e.textContent = nombre);
      // Tema elegido por la barbería (?tema= y ?color= solo para que el admin lo pruebe antes de guardar)
      const tema = TEMAS.includes(QS.get('tema')) ? QS.get('tema') : n.tema, color = /^#[0-9a-f]{6}$/i.test(QS.get('color') || '') ? QS.get('color') : n.color;
      aplicarTema(tema, color);
      if (typeof aplicarEstiloPublico === 'function') aplicarEstiloPublico(n);
      if (!QS.get('tema')) try { localStorage.setItem(K_TEMA, JSON.stringify({ tema, color })); } catch(e) {}
      if (n.slug && $('accesoEquipo')) $('accesoEquipo').href = 'panel.html?n=' + encodeURIComponent(n.slug);
      $('creditos').innerHTML = (n.slug || PRINCIPAL) !== PRINCIPAL ? `· con <a href="${esc(CONF.SITIO || '#')}" target="_blank" rel="noopener" style="color:inherit;">${esc(CONF.MARCA || 'TwoWeb')}</a>` : '';
    }
    // ---------- TEMAS: colores, formas y letras de cada barbería ----------
    const TEMAS = ['clasico', 'burbuja', 'vintage', 'neon', 'minimal', 'organico'];
    const FUENTES = { burbuja:'Nunito:wght@400;600;700;800', vintage:'Playfair+Display:wght@600;700;800', neon:'Oswald:wght@500;600;700',
                      minimal:'Inter:wght@400;500;600;700;800', organico:'Fraunces:opsz,wght@9..144,600;9..144,800' };
    const ACENTO = { clasico:'#ff7a2f', burbuja:'#7c83ff', vintage:'#a4161a', neon:'#00e5ff', minimal:'#111827', organico:'#d9a05b' };
    function textoSobre(c){
      const l = i => { const x = parseInt(c.slice(i, i + 2), 16) / 255; return x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; };
      const L = .2126 * l(1) + .7152 * l(3) + .0722 * l(5);
      return (L + .05) / .0556 >= 1.05 / (L + .05) ? '#111' : '#fff';
    }
    function aplicarTema(tema, color){
      const t = TEMAS.includes(tema) ? tema : 'clasico', raiz = document.documentElement;
      if (t === 'clasico') delete raiz.dataset.tema; else raiz.dataset.tema = t;
      if (FUENTES[t] && !document.getElementById('fuente-' + t)){
        const l = document.createElement('link'); l.id = 'fuente-' + t; l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=' + FUENTES[t] + '&display=swap'; document.head.appendChild(l);
      }
      const c = /^#[0-9a-f]{6}$/i.test(color || '') ? color : ACENTO[t];
      raiz.style.setProperty('--voltaje', c); raiz.style.setProperty('--sobre', textoSobre(c));
    }
    try { const g = JSON.parse(localStorage.getItem(K_TEMA) || 'null'); if (g) aplicarTema(g.tema, g.color); } catch(e) {}   // sin parpadeo al cargar
    const nombreNegocio = () => CFG.negocio?.nombre || CONF.MARCA || 'TwoWeb';
    // ¿Esta barbería tiene activo el 10% en la primera visita? (lo activa TwoWeb desde el panel)
    const promoActiva = () => CFG.negocio && 'promo_10' in CFG.negocio ? !!CFG.negocio.promo_10 : (!SLUG || SLUG === PRINCIPAL);
    const pasoInicial = () => CFG.locales.length === 1 ? 2 : 1;
    // Portada, frase de bienvenida y banner del 10% (solo en el primer paso)
    function pintarInicio(){
      const n = CFG.negocio || {}, el = $('inicio');
      if (paso !== pasoInicial()) { el.innerHTML = ''; return; }
      const insta = (n.instagram || '').replace(/^@/, '');
      const txt = (n.bienvenida || insta) ? `<div class="hero-txt"><h1>${esc(nombreNegocio())}</h1>${n.bienvenida ? `<p>${esc(n.bienvenida)}</p>` : ''}${insta ? `<a href="https://www.instagram.com/${encodeURIComponent(insta)}/" target="_blank" rel="noopener">📷 @${esc(insta)}</a>` : ''}</div>` : '';
      const hero = n.portada_url ? `<div class="hero"><img src="${esc(n.portada_url)}" alt="${esc(nombreNegocio())}">${txt}</div>`
                 : txt ? `<div class="hero sin-foto">${txt}</div>` : '';
      el.innerHTML = hero + bannerPromo();

    // ---------- NAVEGACIÓN ENTRE CAPAS ----------
    // Cada capa queda en el historial: el botón "atrás" del teléfono vuelve una capa (no se sale de la página)
    let empujados = 0, pos = 0, misAbierto = false, reservado = false;
    function empujar(st){ history.pushState({ ...st, i: ++pos }, ''); empujados++; }
    function avanzar(a){ paso = a; empujar({ paso }); dibujar(); window.scrollTo({ top:0 }); }
    function atras(){ if (empujados > 0) history.back(); else { retroceder(); dibujar(true); window.scrollTo({ top:0 }); } }
    window.addEventListener('popstate', e => {
      const i = e.state?.i ?? 0;
      if (i > pos){ pos = i; empujados++; return; }      // "adelante" del navegador: se queda donde está
      pos = i;
      empujados = Math.max(0, empujados - 1);
      if (misAbierto) { cerrarMisReservas(); return; }
      if (reservado) return;
      retroceder(); dibujar(true); window.scrollTo({ top:0 });
    });
    // Si el profesional ya está decidido (link personal o local con una sola persona) se salta su paso
    const saltaPro = () => !!FIJO || prosLocal().length === 1;
    function inicioPersona(){
      draft.eleccion = FIJO || (prosLocal().length === 1 ? prosLocal()[0].id : null);
      return saltaPro() ? 3 : 2;
    }
    function retroceder(){
      const primero = saltaPro() ? 3 : 2;
      if (paso === primero && persona() > 0){      // vuelve a la hora de la persona anterior
        draft = citas.pop(); paso = 4;
      } else if (paso === 5 && conProds()){
        paso = 6;
      } else if (paso === 5 || paso === 6){
        draft = citas.pop(); paso = 4;
      } else if (paso === 3 && saltaPro()){
        if (!FIJO && CFG.locales.length > 1) paso = 1;
      } else if (paso === 2){
        if (CFG.locales.length > 1) paso = 1;
      } else if (paso > 1){
        paso--;
      }
    }
    // Tocar un paso ya hecho del stepper
    function irAPaso(k){
      if (pos_(k) < 0 || pos_(k) >= pos_(paso)) return;
      if (k === 1 && CFG.locales.length === 1) return;
      if (k === 2 && saltaPro()) return;
      if ((paso === 5 || paso === 6) && k <= 4){ draft = citas.pop(); }
      paso = k; empujar({ paso }); dibujar(true);
    }

    function dibujar(haciaAtras){
      const NP = NOMBRE_PASO();
      $('stepper').innerHTML = ORDEN().map((k, i) => {
        const hecho = i < pos_(paso), cls = hecho ? 'hecho' : k === paso ? 'actual' : '';
        return `<button class="st ${cls}" onclick="irAPaso(${k})" ${hecho ? '' : 'tabindex="-1"'}><span class="st-num">${hecho ? '✓' : i + 1}</span><span class="st-txt">${NP[k].toUpperCase()}</span></button>`;
      }).join('');
      const l = localSel();
      let ctx = '';
      if (l && paso > 1) ctx += `<span class="pill">📍 Reservando en ${esc(l.nombre)} ${CFG.locales.length > 1 ? `<button onclick="cambiarLocal()">cambiar</button>` : ''}</span>`;
      if (FIJO && paso !== 3) ctx += `<span class="pill">👤 Agendando con ${esc(nombreTrab(FIJO))}</span>`;
      if (n > 1 && paso !== 5 && paso !== 6) ctx += `<span class="pill persona">👤 ${etiqueta(persona())} de ${n}</span>`;
      const partes = [];
      if (paso >= 3 && paso <= 4 && draft.eleccion !== null && !FIJO) partes.push(draft.eleccion === AUTO ? 'Cualquiera disponible' : 'con ' + nombreTrab(draft.eleccion));
      if (paso === 4 && draft.servicios.length) partes.push(servDe(draft).map(s => s.nombre).join(' + '));
      if (partes.length) ctx += `<span class="subtitulo">${esc(partes.join(' · '))}</span>`;
      $('contexto').innerHTML = ctx;
      pintarInicio();

      const v = $('vista');
      v.className = 'capa' + (haciaAtras ? ' atras' : '');
      void v.offsetWidth;                          // reinicia la animación
      barra(null);
      [null, capaSucursal, capaBarbero, capaServicio, capaFecha, capaDatos, capaProductos][paso]();
    }
    function cambiarLocal(){
      if ((citas.length || draft.servicios.length) && !confirm('Si cambias de sucursal se borra lo que elegiste. ¿Seguir?')) return;
      citas = []; draft = nuevoDraft(); FIJO = null; paso = 1; empujar({ paso }); dibujar(true);
    }

    // Barra inferior fija (resumen + botón)
    function barra(cfg){
      const b = $('barra');
      if (!cfg){ b.classList.remove('ver'); return; }
      $('barraTxt').innerHTML = cfg.html;
      $('barraBtn').textContent = cfg.boton;
      $('barraBtn').disabled = !!cfg.deshabilitado;
      $('barraBtn').onclick = cfg.accion;
      b.classList.add('ver');
    }

    // ---------- INSCRIPCIÓN: 10% en la primera visita ----------
    function bannerPromo(){
      if (!promoActiva()) return '';
      if (leerLocal(K_INSCRITO)) return `<div class="promo ok"><span class="pct">✓</span><span><b>Estás inscrito</b><span class="s">Tu 10% de primera visita se aplica solo al reservar con tu WhatsApp.</span></span></div>`;
      return `<button class="promo" onclick="verInscripcion()"><span class="pct">10%</span><span><b>¿Primera vez? Inscríbete y obtén 10% en tu primera visita</b><span class="s">Toma 20 segundos · Toca aquí</span></span></button>`;
    }
    function verInscripcion(){
      $('asistente').classList.add('oculto'); $('vistaListo').classList.add('oculto'); $('vistaMis').classList.add('oculto'); $('vistaInsc').classList.remove('oculto'); barra(null);
      if (!$('iCod').options.length) $('iCod').innerHTML = PAISES.map(([v, t]) => `<option value="${v}">${t}</option>`).join('');
      if (!misAbierto){ misAbierto = true; empujar({ insc:true }); }
      window.scrollTo({ top:0 });
    }
    async function inscribirme(){
      const est = $('estadoInsc'), cod = $('iCod').value, dig = $('iTel').value.replace(/\D/g, '');
      const p = { nombre: $('iNombre').value.trim(), apellido: $('iApellido').value.trim(), correo: $('iCorreo').value.trim(),
                  telefono: cod === '+56' ? `+56 ${dig.slice(0,1)} ${dig.slice(1,5)} ${dig.slice(5)}` : `${cod} ${dig}`, promos: $('iPromos').checked };
      if (!p.nombre || !p.apellido){ est.textContent = 'Escribe tu nombre y apellido.'; return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(p.correo)){ est.textContent = 'Revisa tu correo.'; return; }
      if (cod === '+56' ? !/^9\d{8}$/.test(dig) : dig.length < 6){ est.textContent = 'Revisa tu WhatsApp (9 dígitos, parte con 9).'; return; }
      $('btnInsc').disabled = true; est.style.color = 'var(--gris)'; est.textContent = 'Inscribiendo…';

        email: DOMINIOS.includes('@' + dom) ? us : p.correo, dominio: DOMINIOS.includes('@' + dom) ? '@' + dom : 'otro', cod, tel: $('iTel').value, promos: p.promos });
      datosCliente = leerLocal('twoweb-cliente') || {};
      $('vistaInsc').querySelector('.tarjeta').innerHTML = `<div class="listo"><div class="ok">✓</div><h2>${data.beneficio ? '¡Listo! Tienes 10% en tu primera visita' : '¡Datos actualizados!'}</h2>
        <p class="ayuda">${data.beneficio ? 'Se aplica automáticamente cuando reserves con este WhatsApp.' : 'Como ya te has atendido con nosotros, el 10% de primera visita no aplica, pero te llegarán nuestras promociones.'}</p>
        <button class="boton" onclick="volverDeMis()">Reservar ahora</button></div>`;
    }

    // ---------- 1) SUCURSAL ----------
    function capaSucursal(){
      $('vista').innerHTML = `<h2>¿Dónde te quieres atender?</h2><p class="ayuda">Elige el local. Cada uno tiene su propio equipo y precios.</p>
        <div class="locales">${CFG.locales.map(l => {
          const nb = CFG.trabajadores.filter(t => t.local_id === l.id).length;
          const mapa = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(l.direccion || l.nombre);
          return `<button class="local ${l.id === LOCAL ? 'sel' : ''}" onclick="elegirLocal(${l.id})">
            <div class="local-ic">📍</div><b>${esc(l.nombre)}</b>
            <div class="dir">${esc(l.direccion || '')}</div>
            ${l.referencia ? `<div class="ref">🚇 ${esc(l.referencia)}</div>` : ''}
            <div class="pie-local"><span>${nb} ${nb === 1 ? pro() : pros()}</span><a href="${mapa}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Cómo llegar ↗</a></div>
          </button>`; }).join('')}</div>`;
    }
    function elegirLocal(id){
      if (LOCAL !== id){ citas = []; draft = nuevoDraft(); n = 1; }
      LOCAL = id; avanzar(inicioPersona());
    }

    // ---------- 2) SERVICIO ----------
    function capaServicio(){
      const fijo = draft.eleccion !== null && draft.eleccion !== AUTO ? trab(draft.eleccion) : null;
      const servs = servsLocal().filter(s => !fijo || fijo.servicios.includes(s.id));
      if (!servs.length){ $('vista').innerHTML = `<h2>Elige tu servicio</h2><div class="vacio">Este local aún no tiene servicios disponibles para reservar online.</div>`; return; }
      // Categorías en orden: "Promociones" primero, luego como vienen
      const cats = [...new Set(servs.map(s => s.categoria || 'Servicios'))].sort((a, b) => (b.toLowerCase().startsWith('promo')) - (a.toLowerCase().startsWith('promo')));
      const posible = id => fijo ? fijo.servicios.includes(id) : aptos([...new Set([...draft.servicios, id])]).length > 0;
      const quien = persona() === 0 ? '' : ` para ${etiqueta(persona()).toLowerCase()}`;
      const volver = persona() > 0 ? '← Volver' : !saltaPro() ? '← Cambiar ' + esc(pro()) : (!FIJO && CFG.locales.length > 1) ? '← Cambiar sucursal' : '';
      $('vista').innerHTML = `${volver ? `<button class="volver" onclick="atras()">${volver}</button>` : ''}
        ${fijo ? cabeceraPro(fijo) : ''}
        <h2>Elige tu servicio${quien}</h2><p class="ayuda">Puedes elegir más de uno. ${fijo ? 'Son los servicios que realiza ' + esc(fijo.nombre) + '.' : 'Los precios son de ' + esc(localSel().nombre) + '.'}</p>
        ${persona() === 0 ? `<div class="personas"><span>¿Para cuántas personas es la reserva?</span>${[1,2,3].slice(0, MAX_PERSONAS).map(k =>
          `<button class="chip ${k === n ? 'sel' : ''}" onclick="elegirPersonas(${k})">${k} ${k === 1 ? 'persona' : 'personas'}</button>`).join('')}</div>` : ''}
        ${cats.map(c => `<div class="cat">${esc(c)}</div><div class="servicios">${servs.filter(s => (s.categoria || 'Servicios') === c).map(s => {
          const sel = draft.servicios.includes(s.id), ok = sel || posible(s.id);
          return `<button class="serv ${sel ? 'sel' : ''} ${ok ? '' : 'no'}" ${ok ? `onclick="toggleServicio(${s.id})"` : `title="Ningún ${esc(pro())} hace este servicio junto a lo que ya elegiste"`}>
            <span class="serv-check">${sel ? '✓' : ''}</span>
            <span class="serv-info"><span class="serv-nom">${esc(s.nombre)}</span>${s.descripcion ? `<span class="serv-desc" style="display:block">${esc(s.descripcion)}</span>` : ''}
              <span class="serv-meta"><span class="dur">⏱ ${s.duracion} min</span><span class="precio">${s.precio_normal > s.precio ? `<s class="antes">${clp(s.precio_normal)}</s> ` : ''}${clp(s.precio)}</span></span></span>
          </button>`; }).join('')}</div>`).join('')}
        ${saltaPro() ? vitrinaMini() : ''}`;
      barraServicio();
    }
    function barraServicio(){
      const k = draft.servicios.length;
      barra({ html: k ? `<b>${clp(totalDe(draft))}</b>${k} ${k === 1 ? 'servicio' : 'servicios'} · ${durDe(draft)} min` : '<b>Elige un servicio</b>Toca una tarjeta para agregarla',
              boton: 'Continuar →', deshabilitado: !k, accion: siguienteDeServicio });
    }
    function siguienteDeServicio(){ avanzar(4); }
    function elegirPersonas(k){ n = k; dibujar(); }
    function toggleServicio(id){
      draft.servicios = draft.servicios.includes(id) ? draft.servicios.filter(x => x !== id) : [...draft.servicios, id];
      draft.tid = null; draft.t = null;
      const y = window.scrollY; capaServicio(); window.scrollTo({ top:y });
    }

    // ---------- 3) BARBERO ----------
    function cabeceraPro(t){
      return `<div class="pro-cab"><div class="foto" ${t.foto_url ? `style="background-image:url('${esc(t.foto_url)}')"` : ''}>${t.foto_url ? '' : esc(t.nombre[0])}</div>
        <div><small>${esc(PRO())}</small><b>${esc(t.nombre)}</b></div></div>`;
    }
    function capaBarbero(){
      const lista = prosLocal();
      const foto = t => t.foto_url ? `style="background-image:url('${esc(t.foto_url)}')"` : '';
      const volver = persona() > 0 ? '← Volver' : CFG.locales.length > 1 ? '← Cambiar sucursal' : '';
      $('vista').innerHTML = `${volver ? `<button class="volver" onclick="atras()">${volver}</button>` : ''}
        <h2>¿Con quién te quieres atender?</h2><p class="ayuda">Elige a tu ${esc(pro())} y después tus servicios.</p>
        ${lista.length ? `<div class="barberos">
          ${lista.length > 1 ? `<button class="barbero cualquiera ${draft.eleccion === AUTO ? 'sel' : ''}" onclick="elegirBarbero('${AUTO}')"><div class="foto">⚡</div><b>Cualquiera disponible</b><small>Más horas para elegir</small></button>` : ''}
          ${lista.map(t => `<button class="barbero ${draft.eleccion === t.id ? 'sel' : ''}" onclick="elegirBarbero(${t.id})">
            <div class="foto" ${foto(t)}>${t.foto_url ? '' : esc(t.nombre[0])}</div><b>${esc(t.nombre)}</b><small>Ver sus servicios</small></button>`).join('')}
        </div>` : `<div class="vacio">Este local aún no tiene ${esc(pros())} con servicios para reservar online.</div>`}
        ${vitrinaMini()}`;
    }
    function elegirBarbero(v){
      const e = v === AUTO ? AUTO : Number(v);
      if (e !== draft.eleccion){
        draft.t = null; draft.tid = null;
        // se quedan solo los servicios que hace la nueva elección
        draft.servicios = e === AUTO ? draft.servicios.filter(id => aptos([id]).length) : draft.servicios.filter(id => trab(e).servicios.includes(id));
      }
      draft.eleccion = e; avanzar(3);
    }
    // Adelanto de la tienda en el primer paso (solo vista; se compra al final)
    function vitrinaMini(){
      if (!conProds() || persona() > 0) return '';
      const ps = CFG.productos_reserva.slice(0, 4);
      return `<div class="vitrina-mini"><div class="vm-fotos">${ps.map(p => `<span ${p.imagen_url ? `style="background-image:url('${esc(p.imagen_url)}')"` : ''}>${p.imagen_url ? '' : esc(p.nombre[0])}</span>`).join('')}</div>
        <div><b>🛍 También tenemos productos</b><small>Antes de confirmar podrás agregarlos (opcional) y los pagas en tu hora.</small></div></div>`;
    }

    // ---------- DISPONIBILIDAD ----------
    function horarioDe(tid, dow){ return CFG.horarios.find(h => h.trabajador_id === tid && h.dia === dow); }
    function candidatos(){
      if (draft.eleccion !== AUTO) return [draft.eleccion];
      return aptos(draft.servicios).map(t => t.id).sort((a, b) => (carga[a]||0) - (carga[b]||0));   // el menos cargado primero
    }
    const trabaja = dow => candidatos().some(tid => horarioDe(tid, dow));
    function estaLibre(tid, dow, desde, hasta, minimo){
      const h = horarioDe(tid, dow);
      if (!h || desde < aMin(h.inicio) || hasta > aMin(h.fin) || desde < minimo) return false;
      if (h.almuerzo_inicio && desde < aMin(h.almuerzo_fin) && hasta > aMin(h.almuerzo_inicio)) return false;
      return !ocupacion.some(o => o.trabajador_id === tid && desde < o.hasta && hasta > o.desde);
    }

    // ---------- 4) FECHA Y HORA ----------
    function capaFecha(){
      const hoy = deTexto(hoyTxt());
      const limite = new Date(hoy); limite.setDate(limite.getDate() + DIAS_LIMITE);
      const dias = [];
      for (let i = 0; i < Math.min(DIAS_TIRA, DIAS_LIMITE + 1); i++){ const f = new Date(hoy); f.setDate(f.getDate() + i); dias.push(f); }
      if (draft.fecha && !dias.some(f => fechaTexto(f) === draft.fecha)) dias.push(deTexto(draft.fecha));
      if (!draft.fecha){ const primero = dias.find(f => trabaja(f.getDay())); if (primero) draft.fecha = fechaTexto(primero); }
      const top = (f, i) => i === 0 && fechaTexto(f) === hoyTxt() ? 'Hoy' : i === 1 ? 'Mañana' : f.toLocaleDateString('es-CL', { weekday:'short' }).replace('.', '');
      $('vista').innerHTML = `<button class="volver" onclick="atras()">← Volver a servicios</button>
        <h2>Elige fecha y hora</h2><p class="ayuda">${draft.eleccion === AUTO ? 'Te asignamos al ' + esc(pro()) + ' con menos reservas ese día; si está ocupado a esa hora, pasa al siguiente.' : 'Horas libres de ' + esc(nombreTrab(draft.eleccion)) + '.'}</p>
        <div class="dias" id="dias">${dias.map((f, i) => {
          const ft = fechaTexto(f), abre = trabaja(f.getDay());
          return `<button class="dia ${ft === draft.fecha ? 'sel' : ''} ${abre ? '' : 'off'}" ${abre ? `onclick="elegirDia('${ft}')"` : 'title="Cerrado"'}>
            <div class="dia-top">${top(f, i)}</div><div class="dia-num">${f.getDate()}</div><div class="dia-mes">${abre ? MESES[f.getMonth()] : 'cerrado'}</div></button>`; }).join('')}</div>
        <div class="otra"><button onclick="toggleCal()">📅 ${calAbierto ? 'Cerrar calendario' : 'Elegir otro día'}</button>
          <span class="nota">Puedes reservar hasta el ${limite.getDate()} de ${MESES_L[limite.getMonth()]}</span></div>
        <div id="calCaja">${calAbierto ? calHTML() : ''}</div>
        <div id="horas"></div>`;
      const sel = $('dias').querySelector('.sel'); if (sel) sel.scrollIntoView({ block:'nearest', inline:'center' });
      if (draft.fecha) return cargarHoras(); else $('horas').innerHTML = '<div class="vacio">No hay días con atención en las próximas semanas. Prueba "Elegir otro día".</div>';
    }
    function elegirDia(ft){ draft.fecha = ft; draft.t = null; draft.tid = null; calAbierto = false; return capaFecha(); }
    // ----- Calendario del mes (Fase 45): todos los días que el negocio permite reservar -----
    function toggleCal(){ calAbierto = !calAbierto; if (calAbierto) calMes = null; $('calCaja').innerHTML = calAbierto ? calHTML() : '';
      document.querySelector('.otra button').textContent = calAbierto ? '📅 Cerrar calendario' : '📅 Elegir otro día';
      if (calAbierto) $('calCaja').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    function moverCal(d){ const m = calMes || mesDe(draft.fecha); calMes = new Date(m.getFullYear(), m.getMonth() + d, 1); $('calCaja').innerHTML = calHTML(); }
    const mesDe = ft => { const f = ft ? deTexto(ft) : deTexto(hoyTxt()); return new Date(f.getFullYear(), f.getMonth(), 1); };
    function calHTML(){
      const hoy = deTexto(hoyTxt()), lim = new Date(hoy); lim.setDate(lim.getDate() + DIAS_LIMITE);
      const m = calMes || mesDe(draft.fecha), y = m.getFullYear(), mm = m.getMonth();
      const off = (new Date(y, mm, 1).getDay() + 6) % 7, nd = new Date(y, mm + 1, 0).getDate();
      const ant = new Date(y, mm, 1) > new Date(hoy.getFullYear(), hoy.getMonth(), 1), sig = new Date(y, mm + 1, 1) <= lim;
      let celdas = '';
      for (let i = 0; i < off; i++) celdas += '<span></span>';
      for (let d = 1; d <= nd; d++){
        const f = new Date(y, mm, d), ft = fechaTexto(f), fuera = f < hoy || f > lim, cerrado = !trabaja(f.getDay());
        celdas += fuera || cerrado ? `<button class="cd off" disabled title="${cerrado && !fuera ? 'Cerrado' : 'No disponible'}">${d}</button>`
          : `<button class="cd ${ft === draft.fecha ? 'sel' : ''} ${ft === hoyTxt() ? 'hoy' : ''}" onclick="elegirDia('${ft}')">${d}</button>`;
      }
      return `<div class="cal"><div class="cal-cab"><button onclick="moverCal(-1)" ${ant ? '' : 'disabled'} aria-label="Mes anterior">‹</button>
          <b>${MESES_L[mm][0].toUpperCase() + MESES_L[mm].slice(1)} ${y}</b><button onclick="moverCal(1)" ${sig ? '' : 'disabled'} aria-label="Mes siguiente">›</button></div>
        <div class="cal-sem"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
        <div class="cal-dias">${celdas}</div></div>`;
    }
    // Si un día está lleno: buscar el próximo día con horas libres
    async function proximoDia(){
      const hoy = deTexto(hoyTxt()), lim = new Date(hoy); lim.setDate(lim.getDate() + DIAS_LIMITE);
      const f = deTexto(draft.fecha || hoyTxt());
      for (let i = 0; i < 31; i++){
        f.setDate(f.getDate() + 1); if (f > lim) break;
        if (!trabaja(f.getDay())) continue;
        await elegirDia(fechaTexto(f));
        if (libres.length) return;
      }
      alertaHoras('No encontramos horas libres en los próximos días. Prueba con otro ' + pro() + ' o escríbenos.');
    }
    function otraFecha(v){   // (se mantiene por compatibilidad)
      if (!v) return;
      if (!trabaja(deTexto(v).getDay())){ alertaHoras('Ese día no atendemos. Elige otro.'); return; }
      elegirDia(v);
    }
    function alertaHoras(txt){ $('horas').innerHTML = `<div class="vacio">${esc(txt)}</div>`; }

    async function cargarHoras(){
      alertaHoras('Buscando horas libres…');
      const fecha = draft.fecha;
      const { data, error } = await rpcNeg('ocupacion', { p_fecha: fecha, p_negocio: SLUG || null });
      if (fecha !== draft.fecha || paso !== 4) return;           // cambió de día mientras cargaba
      if (error){ $('horas').innerHTML = `<p class="aviso">Error: ${esc(error.message)}</p>`; return; }
      // Ocupado = reservas y bloqueos + las horas que ya elegiste para las otras personas
      ocupacion = data.concat(citas.filter(c => c.fecha === fecha).map(c => ({ trabajador_id: c.tid, desde: c.t, hasta: c.t + durDe(c) })));
      carga = {}; ocupacion.forEach(o => { carga[o.trabajador_id] = (carga[o.trabajador_id]||0) + (o.hasta - o.desde); });

      const dow = deTexto(fecha).getDay(), dur = durDe(draft);
      const [hoy, hhmm] = CFG.ahora.split('T');
      const minimo = fecha === hoy ? Math.ceil((aMin(hhmm) + 15) / PASO_MIN) * PASO_MIN : 0;
      const cands = candidatos(), hs = cands.map(tid => horarioDe(tid, dow)).filter(Boolean);
      if (!hs.length){ alertaHoras('Ese día no atendemos.'); return; }
      const desdeDia = Math.min(...hs.map(h => aMin(h.inicio))), hastaDia = Math.max(...hs.map(h => aMin(h.fin)));
      libres = [];
      for (let t = Math.ceil(desdeDia / PASO_MIN) * PASO_MIN; t + dur <= hastaDia; t += PASO_MIN){
        const tid = cands.find(id => estaLibre(id, dow, t, t + dur, minimo));
        if (tid) libres.push({ t, tid });
      }
      dibujarHoras();
    }
    function dibujarHoras(){
      if (!libres.length){ $('horas').innerHTML = `<div class="vacio">No quedan horas este día.
          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;"><button class="boton" style="width:auto;" onclick="proximoDia()">Ver el próximo día con horas →</button>
          <button style="width:auto;background:none;border:1px dashed color-mix(in srgb, var(--hueso) 30%, transparent);color:var(--hueso);padding:10px 16px;border-radius:var(--r-s);cursor:pointer;font:inherit;" onclick="if(!calAbierto) toggleCal()">📅 Elegir otro día</button></div></div>`; return; }
      const man = libres.filter(x => x.t < 13*60), tar = libres.filter(x => x.t >= 13*60);
      if (franja === 'man' && !man.length) franja = 'tar';
      if (franja === 'tar' && !tar.length) franja = 'man';
      if (draft.t !== null) franja = draft.t < 13*60 ? 'man' : 'tar';
      const lista = franja === 'man' ? man : tar, auto = draft.eleccion === AUTO;
      $('horas').innerHTML = `<div class="tabs">
          <button class="tab ${franja === 'man' ? 'sel' : ''}" ${man.length ? '' : 'disabled'} onclick="franja='man'; draft.t=null; dibujarHoras()">☀️ Mañana<b>${man.length}</b></button>
          <button class="tab ${franja === 'tar' ? 'sel' : ''}" ${tar.length ? '' : 'disabled'} onclick="franja='tar'; draft.t=null; dibujarHoras()">🌙 Tarde<b>${tar.length}</b></button></div>
        <div class="horas">${lista.map(x => `<button class="hora ${draft.t === x.t ? 'sel' : ''}" onclick="elegirHora(${x.t})">${aHora(x.t)}${auto ? `<small>${esc(nombreTrab(x.tid))}</small>` : ''}</button>`).join('')}</div>`;
      barraHora();
    }
    function elegirHora(t){
      const x = libres.find(l => l.t === t); if (!x) return;
      draft.t = x.t; draft.tid = x.tid; dibujarHoras();
    }
    function barraHora(){
      const listo = draft.t !== null;
      const sig = persona() + 1 < n ? `Seguir con ${etiqueta(persona() + 1)} →` : 'Continuar →';
      barra({ html: listo ? `<b>${fechaLinda(draft.fecha)} · ${aHora(draft.t)}</b>con ${esc(nombreTrab(draft.tid))} · hasta ${aHora(draft.t + durDe(draft))} · ${clp(totalDe(draft))}`
                          : '<b>Elige una hora</b>Toca una de las horas libres',
              boton: sig, deshabilitado: !listo, accion: guardarCita });
    }
    function guardarCita(){
      citas.push({ ...draft });
      const fechaAnterior = draft.fecha;
      draft = nuevoDraft();
      if (persona() < n){ draft.fecha = fechaAnterior; avanzar(inicioPersona()); }    // la siguiente persona parte en el mismo día
      else avanzar(conProds() ? 6 : 5);
    }

    // ---------- 5) DATOS ----------
    function capaDatos(){
      const d = datosCliente, total = citas.reduce((a, c) => a + totalDe(c), 0);
      const dominio = d.dominio || DOMINIOS[0], cod = d.cod || '+56';
      const tp = totalProds();
      $('vista').innerHTML = `<button class="volver" onclick="atras()">${conProds() ? '← Volver a productos' : '← Volver a la hora'}</button>
        <h2>Tus datos</h2><p class="ayuda">Revisa tu reserva y completa tus datos para confirmar.</p>
        <div class="tarjeta"><h3>Tu reserva · ${esc(localSel().nombre)}</h3>${citas.map((c, i) => `
          <div class="res-item">
            ${n > 1 ? `<div class="res-linea"><b>${etiqueta(i)}</b><button class="link" onclick="editarPersona(${i})">Cambiar</button></div>` : ''}
            <div class="res-linea"><span>${esc(servDe(c).map(s => s.nombre).join(' + '))}</span><b>${clp(totalDe(c))}</b></div>
            <div class="res-linea g"><span>${fechaLinda(c.fecha)} · ${aHora(c.t)} – ${aHora(c.t + durDe(c))}</span><span>con ${esc(nombreTrab(c.tid))}</span></div>
          </div>`).join('')}
          ${tp ? `<div class="res-item"><div class="res-linea"><span>🛍 ${itemsR().map(x => x.cantidad + '× ' + esc(prodR(x.id).nombre)).join(', ')}</span><b>${clp(tp)}</b></div>
            <div class="res-linea g"><span>Productos apartados para tu hora</span><button class="link" onclick="irAPaso(6)">Cambiar</button></div></div>` : ''}</div>

        <div class="tarjeta">
          <div class="fila2">
            <div class="campo"><label class="lbl" for="fNombre">Nombre</label><input id="fNombre" autocomplete="given-name" value="${esc(d.nombre || '')}" placeholder="Tu nombre"></div>
            <div class="campo"><label class="lbl" for="fApellido">Apellido</label><input id="fApellido" autocomplete="family-name" value="${esc(d.apellido || '')}" placeholder="Tu apellido"></div>
          </div>
          ${citas.slice(1).map((c, i) => `<div class="campo"><label class="lbl">Nombre de la persona ${i+2}</label><input class="acomp" value="${esc((d.acomp || [])[i] || '')}" placeholder="Nombre"></div>`).join('')}
          <div class="campo"><label class="lbl" for="fEmail">Email</label>
            <div class="junto" id="juntoEmail"><input id="fEmail" autocomplete="email" autocapitalize="off" spellcheck="false" value="${esc(d.email || '')}" placeholder="ej: tunombre" oninput="revisarEmail()">
              <select id="fDominio" onchange="revisarEmail()">${DOMINIOS.map(x => `<option ${x === dominio ? 'selected' : ''}>${x}</option>`).join('')}<option value="otro" ${dominio === 'otro' ? 'selected' : ''}>otro…</option></select></div>
            <div class="nota" id="emailFinal" style="margin-top:5px;"></div></div>
          <div class="campo"><label class="lbl" for="fTel">Teléfono</label>
            <div class="junto"><select id="fCod" onchange="cambiarPais()">${PAISES.map(([v, t]) => `<option value="${v}" ${v === cod ? 'selected' : ''}>${t}</option>`).join('')}</select>
              <input id="fTel" type="tel" inputmode="tel" autocomplete="tel-national" value="${esc(d.tel ?? (cod === '+56' ? '9 ' : ''))}" placeholder="${cod === '+56' ? '9 1234 5678' : 'Número'}" oninput="formatoTel()"></div></div>
          <label class="check"><input type="checkbox" id="fWsp" ${d.wsp === false ? '' : 'checked'}><span>Quiero recibir la confirmación y recordatorios por <b>WhatsApp</b></span></label>
          <label class="check"><input type="checkbox" id="fPromos" ${d.promos === false ? '' : 'checked'}><span>Quiero recibir promociones y descuentos</span></label>
          ${CUMPLE && CUMPLE.activa ? `<div class="campo"><label class="lbl" for="fNac">🎂 Fecha de cumpleaños (opcional)</label><input id="fNac" type="date" max="${new Date().toISOString().slice(0, 10)}" value="${esc(d.nac || '')}">
            <p class="nota" style="margin-top:4px;">Te regalamos <b>${CUMPLE.pct >= 100 ? 'tu servicio gratis' : CUMPLE.pct + '% de descuento'}</b> en ${textoVentanaCumple(CUMPLE.ventana)}.</p></div>` : ''}
          ${promoActiva() && leerLocal(K_INSCRITO) ? '<p class="nota" style="margin:-6px 0 12px;">🎁 Si es tu primera visita, tu 10% se aplica al confirmar.</p>' : ''}
          <div class="campo"><label class="lbl" for="fObs">Observaciones (opcional)</label><textarea id="fObs" placeholder="${esBarberia() ? 'Ej: degradado bajo, dejar largo arriba…' : 'Ej: algo que debamos saber antes de tu hora…'}">${esc(d.obs || '')}</textarea></div>
          <label class="lbl">Foto de referencia (opcional)</label>

    function cajaFoto(){
      return foto ? `<img src="${foto}" alt="Foto de referencia"><span style="flex:1;">Foto agregada ✓<br><span class="nota">Toca para cambiarla</span></span><button class="link" onclick="event.preventDefault(); quitarFoto()">Quitar</button>`
                  : `<span class="ic">📷</span><span style="flex:1;">Agregar foto de referencia<br><span class="nota">Así tu ${esc(pro())} sabe lo que quieres</span></span>`;

    function quitarFoto(){ foto = null; $('subir').innerHTML = cajaFoto() + '<input type="file" accept="image/*" class="oculto" onchange="cargarFoto(this.files[0])">'; }
    // La foto se achica en el teléfono (máx. 800 px, ~200 KB) para que suba rápido y no llene la base de datos
    function cargarFoto(archivo){
      if (!archivo) return;
      const img = new Image(), url = URL.createObjectURL(archivo);
      img.onload = () => {
        const k = Math.min(1, 800 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let q = 0.78, out = c.toDataURL('image/jpeg', q);
        while (out.length > 250000 && q > 0.3){ q -= 0.1; out = c.toDataURL('image/jpeg', q); }
        foto = out; URL.revokeObjectURL(url);
        $('subir').innerHTML = cajaFoto() + '<input type="file" accept="image/*" class="oculto" onchange="cargarFoto(this.files[0])">';
      };
      img.onerror = () => { $('estado').textContent = 'No se pudo leer esa imagen.'; };
      img.src = url;
    }

    // Email: se escribe solo el usuario; el dominio (@gmail.com) viene elegido

      $('fEmail').style.borderRadius = u.includes('@') ? '10px' : '';

    // Teléfono: Chile (+56) parte con "9 " y se ordena como 9 1234 5678
    function cambiarPais(){
      const cod = $('fCod').value, t = $('fTel');
      if (cod === '+56' && !t.value.trim()) t.value = '9 ';
      if (cod !== '+56' && t.value.trim() === '9') t.value = '';
      t.placeholder = cod === '+56' ? '9 1234 5678' : 'Número';
      formatoTel(); t.focus();
    }
    function formatoTel(){
      if ($('fCod').value !== '+56') return;
      const t = $('fTel');
      let dig = t.value.replace(/\D/g, '');
      if (dig.startsWith('56') && dig.length > 9) dig = dig.slice(2);
      dig = dig.slice(0, 9);
      if (!dig){ return; }
      const f = dig.length <= 1 ? dig + ' ' : dig[0] + ' ' + dig.slice(1, 5) + (dig.length > 5 ? ' ' + dig.slice(5) : '');
      if (f.trim() !== t.value.trim()) t.value = f;
    }
    function telefonoFinal(){
      const cod = $('fCod').value, dig = $('fTel').value.replace(/\D/g, '');
      return { cod, dig, texto: `${cod} ${cod === '+56' ? dig.replace(/^(\d)(\d{4})(\d{4})$/, '$1 $2 $3') : dig}` };
    }

    async function reservar(){
      const d = leerFormulario(), est = $('estado');

      if (!d.nombre){ est.textContent = "Escribe tu nombre."; $('fNombre').focus(); return; }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo)){ est.textContent = "Revisa tu email."; $('fEmail').focus(); return; }
      if (tel.cod === '+56' ? !/^9\d{8}$/.test(tel.dig) : tel.dig.length < 6){ est.textContent = tel.cod === '+56' ? "El celular debe tener 9 dígitos y partir con 9." : "Revisa tu teléfono."; $('fTel').focus(); return; }

        personas: citas.map((c, i) => ({ nombre: i === 0 ? nombre : d.acomp[i-1], servicios: c.servicios, trabajador_id: c.tid, fecha: c.fecha, hora: aHora(c.t) })) };
      payload.negocio = SLUG || null;
      if (/^\d{4}-\d{2}-\d{2}$/.test(d.nac || '')) payload.nacimiento = d.nac;
      const { data, error } = await db.rpc('reservar_grupo', { p: payload });
      $('btnReservar').disabled = false; est.style.color = '';
      if (error){
        est.textContent = error.message.includes('HORA_OCUPADA') || error.message.includes('bloqueado') || error.message.includes('ocupad')
          ? "Alguien acaba de tomar esa hora. Vuelve y elige otra, por favor."
          : error.message.includes('Failed to fetch') || error.message.includes('NetworkError')
          ? "Se cortó la conexión. Revisa tu internet y vuelve a tocar Confirmar (no se duplica)."
          : "No se pudo reservar: " + error.message;
        return;
      }
      // correo de confirmación: la función de Supabase lo envía desde la cola (si no está instalada, no pasa nada)
      try { fetch(SUPABASE_URL + '/functions/v1/enviar-correos', { method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: '{}', keepalive: true }).catch(() => {}); } catch (e) {}
      guardarLocal('twoweb-cliente', { ...d, obs:'', acomp:[] });
      const l = localSel();
      const detalle = data.map(r => `${r.nombre}: ${r.servicios} con ${r.trabajador} ${r.fecha} ${r.desde}-${r.hasta} (${clp(r.total)})`).join('\n');
      if ((CFG.negocio?.slug || PRINCIPAL) === PRINCIPAL && CONF.FORMSPREE) try {
        await fetch("https://formspree.io/f/" + CONF.FORMSPREE, { method:"POST", headers:{ "Content-Type":"application/json", "Accept":"application/json" },
          body: JSON.stringify({ _subject:`Nueva reserva ${l.nombre} (${data.length} persona${data.length>1?'s':''})`, local: l.nombre, reservas: detalle,
            total: clp(data.reduce((a,r)=>a+r.total,0)), nombre, correo, telefono: tel.texto, whatsapp: d.wsp ? 'sí' : 'no', observaciones: d.obs, foto: foto ? 'sí (ver en el panel)' : 'no' }) });
      } catch(e) {}
      CLIENTE = { nombre, correo, telefono: tel.texto };
      if (itemsR().length){ est.textContent = 'Apartando tus productos…'; await apartarProductos(data); est.textContent = ''; }

    // ---------- 6) PRODUCTOS (opcional, se retiran y pagan en la hora) ----------

    const precioP = p => p.precio_oferta ?? p.precio;

    const prodR = id => (CFG.productos_reserva || []).find(p => p.id === id);
    const totalProds = () => itemsR().reduce((a, x) => a + x.cantidad * precioP(prodR(x.id)), 0);

              <div class="prod-precio">${p.precio_oferta != null ? `<s>${clp(p.precio)}</s> ` : ''}<strong>${clp(precioP(p))}</strong>${p.quedan ? ` <span class="prod-quedan">quedan ${p.quedan}</span>` : ''}</div></div>
            <div class="prod-cant" id="pc${p.id}">${cantHtml(p)}</div></div>`).join('')}</div>`;

    function cantHtml(p){

    async function buscarMisReservas(){
      const cont = $('misLista');

      if (!correo || tel.replace(/\D/g,'').length < 8){ cont.innerHTML = '<p class="aviso">Escribe tu correo y teléfono.</p>'; return; }

      const [{ data, error }, tj] = await Promise.all([
        rpcNeg('mis_reservas', { p_correo: correo, p_telefono: tel, p_negocio: SLUG || null }),
        rpcNeg('mi_tarjeta', { p_correo: correo, p_telefono: tel, p_negocio: SLUG || null }).catch(() => ({})),
        rpcNeg('mis_tarjetas', { p_correo: correo, p_telefono: tel, p_negocio: SLUG || null }).catch(() => ({}))]).then(([a, b, c]) => { EXTRAS = (c && !c.error && c.data) || []; return [a, b]; });

      MIS_DATOS = { correo, tel };

      if (!data.length){ cont.innerHTML = '<div class="vacio">No encontramos reservas próximas con esos datos.</div>' + tarjeta; return; }
      const est = { confirmada:'Confirmada', en_atencion:'En atención', completada:'Atendida', cancelada:'Cancelada', no_asistio:'No asistió' };
      MIS_DATOS = { correo, tel };
      cont.innerHTML = data.map(r => {
        const wsp = r.whatsapp ? String(r.whatsapp).replace(/\D/g, '') : '';
        const acciones = r.estado !== 'confirmada' ? ''
          : r.puede_cancelar === true ? `<div class="mis-acc"><button class="boton-cancelar" onclick="cancelarMiHora(${r.id}, this)">Cancelar hora</button><span class="nota">Puedes cancelar online hasta el ${esc(r.cancelar_hasta || '')}</span></div>`
          : r.puede_cancelar === false ? `<div class="mis-acc"><span class="nota">Ya no se puede cancelar online.${wsp ? ` <a href="https://wa.me/${wsp}?text=${encodeURIComponent('Hola, no podré llegar a mi hora del ' + fechaLinda(r.fecha) + ' a las ' + r.desde + ' (' + (r.nombre || '') + ').')}" target="_blank" rel="noopener">Avísanos por WhatsApp</a>` : ''}</span></div>` : '';
        return `<div class="item-res ${r.estado === 'cancelada' ? 'cancelada' : ''}"><b>${fechaLinda(r.fecha)} · ${esc(r.desde)} – ${esc(r.hasta)}</b> · ${esc(r.nombre)}<br>
          ${esc(r.servicios || 'Reserva')} con ${esc(r.trabajador)}${r.total ? ' · ' + clp(r.total) : ''} · <span class="est-${esc(r.estado)}">${est[r.estado] || esc(r.estado)}</span>${r.confirmo && r.estado === 'confirmada' ? ' · ✓ confirmaste que vienes' : ''}
          ${r.local ? `<br><span class="nota">📍 ${esc(r.local)} · ${esc(r.direccion || '')}</span>` : ''}${acciones}</div>`;

    // ---------- Desde el correo: cancelar o confirmar (Fase 28) ----------
    let MIS_DATOS = null;
    async function abrirDesdeCorreo(){
      const tok = QS.get('mis') || QS.get('confirmar');

    // Tarjetas extra (Fase 39): cumpleaños y beneficios que el negocio deja visibles
    let EXTRAS = [];
    function tarjetasExtra(){
      if (!EXTRAS.length || typeof tarjetaExtraHTML !== 'function') return '';
      return EXTRAS.map(t => `<div style="margin-top:16px;">${tarjetaExtraHTML(t)}</div>${t.tipo === 'cumpleanos'
        ? (t.cliente && !t.nacimiento ? `<div class="campo" style="margin-top:8px;"><label class="lbl" for="misNac">🎂 Registra tu cumpleaños para recibir tu regalo</label>
              <div class="junto"><input id="misNac" type="date" max="${new Date().toISOString().slice(0, 10)}"><button class="boton" style="width:auto;padding:0 18px;" onclick="guardarMiCumple(this)">Guardar</button></div>
              <p class="nota" style="margin-top:4px;">Solo se puede registrar una vez. El regalo se aplica solo al reservar en ${textoVentanaCumple(t.ventana)}.</p></div>`
          : t.nacimiento ? `<p class="fid-msg">${t.usado ? 'Ya usaste tu regalo este año. ¡Nos vemos en tu próximo cumpleaños!' : `El regalo se aplica solo cuando reserves en ${textoVentanaCumple(t.ventana)}.`}</p>` : '') : ''}`).join('');
    }
    async function guardarMiCumple(btn){
      const f = $('misNac').value; if (!f || !MIS_DATOS) return;
      btn.disabled = true;
      const { error } = await rpcNeg('guardar_mi_cumple', { p_correo: MIS_DATOS.correo, p_telefono: MIS_DATOS.tel, p_fecha: f, p_negocio: SLUG || null });
      btn.disabled = false;
      if (error) return alert(error.message);
      buscarMisReservas();
    }
    // Tarjeta de fidelidad (Fase 25): sellos por atención terminada; el premio se aplica solo al reservar
    function tarjetaFidelidad(t){
      if (!t || !t.activa || t.visible === false || typeof tarjetaFidelidadHTML !== 'function') return '';
      const meta = t.meta || 10, n = Math.min(t.sellos || 0, meta), faltan = meta - n;
      const msg = t.pendiente ? `<p class="fid-msg listo">🎁 Tu premio ya está aplicado en tu próxima hora.</p>`
                : t.listo ? `<p class="fid-msg listo">🎉 ¡Completaste tu tarjeta! El premio se aplica solo en tu próxima reserva.</p>`
                : `<p class="fid-msg">Te ${faltan === 1 ? 'falta <b>1 atención</b>' : `faltan <b>${faltan} atenciones</b>`} para tu premio.</p>`;
      return `<div style="margin-top:16px;">${tarjetaFidelidadHTML({ ...t, icono: esBarberia() ? '✂️' : '★' })}</div>${msg}
        <p class="nota" style="margin-top:4px;">Cada atención terminada con este teléfono suma un sello.</p>`;
    }

    // Si algo falla, se muestra en pantalla en vez de quedar en blanco
    window.addEventListener('error', e => {
      const v = $('vista'); if (v) v.insertAdjacentHTML('afterbegin', `<p class="aviso">Error en la página: ${esc(e.message)}</p>`);
    });
    let db;
    if (typeof supabase === 'undefined') $('vista').innerHTML = '<p class="aviso">No se pudo conectar con la base de datos. Revisa tu internet y recarga la página.</p>';
    else { db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); iniciar(); }
  </script>
</body>
